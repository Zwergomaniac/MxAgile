# MxAgile Capability Registry
# Machine-readable catalog of developer-visible Framework capabilities.
# Consumed by: scripts/Get-MxAgileCapabilities.ps1 (authoritative resolver).
# Do NOT load this file directly into every agent conversation.
# Query through the resolver instead.
#
# Capability state model (see docs/capabilities.md for full semantics):
#   SUPPORTED   — Framework knows how to use this capability
#   AVAILABLE   — Required environment/dependency detected and compatible
#   ENABLED     — Project configuration allows use
#   ACTIVE      — Capability is actually in use in the current context
#   DEGRADED    — Operating partially or via fallback
#   UNAVAILABLE — Environment/dependency absent or incompatible
#
# Field meanings:
#   id                            stable snake_case identifier
#   name                          human-readable label
#   description                   one-line purpose
#   category                      context-lifecycle | context-optimization | knowledge-graph | toolchain
#   version_introduced            MxAgile version that added this capability
#   default_state                 "off" | "on" (absent config behaves like default_state)
#   config_location               path to config file relative to project root
#   config_key                    dot-path to the controlling config key
#   activation_mechanism          how to enable this capability
#   requires                      list of capability IDs that must be enabled first
#   external_dependencies         tools/packages that must be present in the environment
#   incompatibilities             capability IDs that cannot be active simultaneously
#   availability_detection        how to detect the capability is available
#   risk                          low | medium | high (impact of mis-configuration)
#   docs_ref                      documentation file relative to project root
#   agent_may_recommend           true = agent may proactively surface this capability
#   agent_may_activate_config     true = agent may safely edit project config to enable
#   user_approval_required        true = enabling requires external install or machine mutation

schema_version: "1.0"
assessed: "2026-10-13"

capabilities:

  # -----------------------------------------------------------------------
  # Context Lifecycle
  # -----------------------------------------------------------------------

  - id: context_lifecycle
    name: "Context Lifecycle"
    description: "Durable mission state, Context Epochs, and checkpoint/resume across context windows."
    category: context-lifecycle
    version_introduced: "1.2"
    default_state: "off"
    config_location: ".mxagile/config.yaml"
    config_key: "context_lifecycle.enabled"
    activation_mechanism: "Set context_lifecycle.enabled: true in .mxagile/config.yaml"
    requires: []
    external_dependencies: []
    incompatibilities: []
    availability_detection: "Always available — no external dependencies required."
    risk: low
    docs_ref: "docs/context-lifecycle.md"
    agent_may_recommend: true
    agent_may_activate_config: true
    user_approval_required: false

  - id: checkpoint_resume
    name: "Checkpoint & Resume"
    description: "Write durable Context Epoch checkpoints and resume missions across context boundaries."
    category: context-lifecycle
    version_introduced: "1.3"
    default_state: "off"
    config_location: ".mxagile/config.yaml"
    config_key: "context_lifecycle.checkpoint_resume"
    activation_mechanism: "Enable context_lifecycle.enabled and context_lifecycle.checkpoint_resume"
    requires: [context_lifecycle]
    external_dependencies: []
    incompatibilities: []
    availability_detection: "Always available — requires only context_lifecycle.enabled."
    risk: low
    docs_ref: "docs/context-lifecycle.md"
    agent_may_recommend: true
    agent_may_activate_config: true
    user_approval_required: false

  - id: manual_rollover
    name: "Manual Context Epoch Rollover"
    description: "Explicitly roll over to a new Context Epoch at a safe lifecycle boundary."
    category: context-lifecycle
    version_introduced: "1.4"
    default_state: "off"
    config_location: ".mxagile/config.yaml"
    config_key: "context_lifecycle.manual_rollover"
    activation_mechanism: "Enable checkpoint_resume first, then set context_lifecycle.manual_rollover: true"
    requires: [checkpoint_resume]
    external_dependencies: []
    incompatibilities: []
    availability_detection: "Always available — requires only checkpoint_resume."
    risk: low
    docs_ref: "docs/context-lifecycle.md"
    agent_may_recommend: true
    agent_may_activate_config: true
    user_approval_required: false

  - id: pressure_recommendations
    name: "Context Pressure Recommendations"
    description: "Emit PRESSURE / ROLLOVER_RECOMMENDED / ROLLOVER_REQUIRED advisories based on context measurement."
    category: context-lifecycle
    version_introduced: "1.4"
    default_state: "off"
    config_location: ".mxagile/config.yaml"
    config_key: "context_lifecycle.pressure_recommendations"
    activation_mechanism: "Enable context_lifecycle.enabled and context_lifecycle.pressure_recommendations. Optionally configure pressure_thresholds or a harness adapter for reliable token measurement."
    requires: [context_lifecycle]
    external_dependencies: []
    incompatibilities: []
    availability_detection: "Always available. Pressure state is UNKNOWN until harness provides token counts."
    risk: low
    docs_ref: "docs/context-lifecycle.md"
    agent_may_recommend: true
    agent_may_activate_config: true
    user_approval_required: false

  - id: auto_rollover
    name: "Automatic Context Epoch Rollover"
    description: "Automatically roll over at the next safe lifecycle boundary when pressure is ROLLOVER_REQUIRED."
    category: context-lifecycle
    version_introduced: "1.4"
    default_state: "off"
    config_location: ".mxagile/config.yaml"
    config_key: "context_lifecycle.auto_rollover"
    activation_mechanism: "Enable checkpoint_resume, manual_rollover and pressure_recommendations first. Enable auto_rollover only after the manual flow is proven stable in this project."
    requires: [checkpoint_resume, manual_rollover, pressure_recommendations]
    external_dependencies: []
    incompatibilities: []
    availability_detection: "Structurally available. Effective pressure measurement requires harness adapter."
    risk: medium
    docs_ref: "docs/context-lifecycle.md"
    agent_may_recommend: true
    agent_may_activate_config: false
    user_approval_required: false
    notes: "Keep disabled until the manual rollover flow is proven. Risk is medium because premature auto-rollover can interrupt long-running tasks."

  # -----------------------------------------------------------------------
  # Context Optimization
  # -----------------------------------------------------------------------

  - id: rtk_optimization
    name: "RTK Command Output Optimization"
    description: "Reduce token consumption from Bash command output by routing through RTK (Rust Token Killer). Applicable to Bash tool calls only; built-in tools (Read, Grep, Glob) are unaffected."
    category: context-optimization
    version_introduced: "1.5"
    default_state: "off"
    config_location: ".mxagile/config.yaml"
    config_key: "context_optimization.rtk.enabled"
    activation_mechanism: "Install RTK (winget install rtk-ai.rtk on Windows), then set context_optimization.rtk.enabled: true. Run 'rtk init -g' to wire the Claude Code PreToolUse hook."
    requires: []
    external_dependencies:
      - id: rtk
        display_name: "RTK (Rust Token Killer)"
        executable: rtk
        version_constraint: ">=0.37.2"
        install_windows: "winget install rtk-ai.rtk"
        install_unix: "brew install rtk"
        license: "Apache-2.0"
        upstream: "https://github.com/rtk-ai/rtk"
        assessed_version: "0.37.2+"
        assessed_date: "2026-10-13"
    incompatibilities: []
    availability_detection: "Detect 'rtk' executable in PATH. Parse 'rtk --version' output."
    risk: low
    docs_ref: "docs/context-optimization.md"
    agent_may_recommend: true
    agent_may_activate_config: true
    user_approval_required: true
    notes: "Affects only Bash tool calls. Exit codes and success/failure semantics remain authoritative. Raw evidence preserved for LOSSLESS_REQUIRED commands. Hook installation mutates ~/.claude/settings.json — requires user approval."

  - id: context_mode_integration
    name: "Context Mode WARM Retrieval"
    description: "Externalize eligible WARM-context material and retrieve it on demand via Context Mode. Reduces active context by offloading large search results, analyses, and historical findings."
    category: context-optimization
    version_introduced: "1.5"
    default_state: "off"
    config_location: ".mxagile/config.yaml"
    config_key: "context_optimization.context_mode.enabled"
    activation_mechanism: "Set up Context Mode for the current harness (setup path: see integration.guidance from the resolver and .mxagile/adapters/*/context-mode*.yaml; user-run, never automatic), then set context_optimization.context_mode.enabled: true."
    requires: []
    external_dependencies:
      - id: context_mode
        display_name: "Context Mode"
        executable: context-mode
        npm_package: context-mode
        claude_plugin: "mksglu/context-mode"
        version_constraint: ">=1.0.33"
        install_claude_code: "/plugin marketplace add mksglu/context-mode"
        install_npm: "npm install -g context-mode"
        license: "ELv2"
        upstream: "https://github.com/mksglu/context-mode"
        assessed_version: "1.0.33+"
        assessed_date: "2026-10-13"
        license_note: "ELv2 — source-available, NOT OSI open source. Not redistributed by MxAgile. Must be installed separately."
    incompatibilities: []
    availability_detection: "Harness-specific and read-only (resolver field 'integration'): plugin/MCP/hooks configuration of the identified harness (Claude Code, Copilot CLI, VS Code Copilot, OpenCode). available=true means a runtime exists, NOT that it works; active requires integration.usable, i.e. an agent-observed healthy ctx_doctor/ctx_stats probe (-ContextModeHealth). Unknown health is never reported as healthy."
    risk: low
    docs_ref: "docs/context-optimization.md"
    agent_may_recommend: true
    agent_may_activate_config: true
    user_approval_required: true
    notes: "MxAgile remains the sole authority for evidence states and mission lifecycle. Content returned by Context Mode is RETRIEVED context, never authoritative MxAgile evidence. Retrieved content cannot directly promote UNVERIFIED->VERIFIED or change gate/mission state. Installation requires user approval (external npm/plugin installation)."

  # -----------------------------------------------------------------------
  # Knowledge Graph
  # -----------------------------------------------------------------------

  - id: graphify
    name: "Graphify Code Graph"
    description: "Enrich the MxAgile artifact graph with a Graphify-generated code graph for deeper structural analysis."
    category: knowledge-graph
    version_introduced: "1.0"
    default_state: "off"
    config_location: ".mxagile/config.yaml"
    config_key: "graphify.enabled"
    activation_mechanism: "Install Graphify CLI (see scripts/install-graphify.ps1), set graphify.enabled: true and enrichment_provider: graphify."
    requires: []
    external_dependencies:
      - id: graphify
        display_name: "Graphify CLI"
        executable: graphify
        version_constraint: ">=0.9.28"
        install: "scripts/install-graphify.ps1"
        upstream: "(internal)"
        assessed_date: "2026-10-13"
    incompatibilities: []
    availability_detection: "Detect 'graphify' executable in PATH. Parse 'graphify --version' output."
    risk: low
    docs_ref: "docs/mxagile-knowledge-graph.md"
    agent_may_recommend: true
    agent_may_activate_config: true
    user_approval_required: true
    notes: "Requires Graphify CLI installation. Run 'scripts/install-graphify.ps1' for project-local installation."

  # -----------------------------------------------------------------------
  # Toolchain — Studio Pro MCP and Concord MCP
  # -----------------------------------------------------------------------

  - id: studio_pro_mcp
    name: "Studio Pro MCP"
    description: "Mendix Studio Pro MCP endpoint — direct IDE control from the agent via HTTP at localhost:7782."
    category: toolchain
    version_introduced: "1.5"
    default_state: "off"
    config_location: ".vscode/mcp.json"
    config_key: "servers.mendix-studio-pro"
    activation_mechanism: "Configure 'mendix-studio-pro' in .vscode/mcp.json (type: http, url: http://localhost:7782/mcp). Studio Pro must be running for availability."
    requires: []
    external_dependencies:
      - id: mendix_studio_pro
        display_name: "Mendix Studio Pro"
        assessed_date: "2026-10-13"
    incompatibilities: []
    availability_detection: "Detect 'mcp__mendix-studio-pro__*' tools in agent tool namespace. Requires operating_mode: LIVE-SP-CURRENT (check-studio-pro-status.ps1). MCP endpoint at http://localhost:7782/mcp must be reachable."
    risk: low
    docs_ref: "docs/execution-intent.md"
    agent_may_recommend: false
    agent_may_activate_config: false
    user_approval_required: false
    notes: "AVAILABLE only when Studio Pro is open for the current project (LIVE-SP-CURRENT). Not a substitute for process-level operating-mode detection. See policies/execution-intent.md."

  - id: concord_mcp
    name: "Concord MCP"
    description: "Concord v2 MCP server — bridge between the AI agent, Mendix Studio Pro, and project knowledge."
    category: toolchain
    version_introduced: "1.5"
    default_state: "off"
    config_location: ".vscode/mcp.json"
    config_key: "servers.concord-v2-mcp"
    activation_mechanism: "Configure 'concord-v2-mcp' in .vscode/mcp.json (type: stdio, script: scripts/start-concord-mcp.ps1). The MCP server process must be running for availability."
    requires: []
    external_dependencies:
      - id: concord_v2
        display_name: "Concord v2 MCP Server"
        assessed_date: "2026-10-13"
    incompatibilities: []
    availability_detection: "Detect 'mcp__concord-v2-mcp__*' tools in agent tool namespace. Secondary: .vscode/mcp.json contains concord-v2-mcp entry (CONFIGURED, not necessarily ACTIVE). Configuration evidence alone does not imply AVAILABLE."
    risk: low
    docs_ref: "docs/execution-intent.md"
    agent_may_recommend: false
    agent_may_activate_config: false
    user_approval_required: false
    notes: "SUPPORTED when .vscode/mcp.json has concord-v2-mcp. AVAILABLE only when mcp__concord-v2-mcp__* tools appear in the agent tool namespace. Combined with studio_pro_mcp AVAILABLE, this constitutes the strong signal for execution-intent resolution. See policies/execution-intent.md."

  # -----------------------------------------------------------------------
  # Context Transition (MxAgile 1.7)
  # -----------------------------------------------------------------------

  - id: context_transition
    name: "Context Transition Coordinator"
    description: "Harness-agnostic coordinator for autonomous context compaction and fresh-epoch transitions."
    category: context-lifecycle
    version_introduced: "1.7"
    default_state: "off"
    config_location: ".mxagile/config.yaml"
    config_key: "context_lifecycle.transition.enabled"
    activation_mechanism: "Enable context_lifecycle.enabled and context_lifecycle.transition.enabled. Requires checkpoint_resume."
    requires: [checkpoint_resume]
    external_dependencies: []
    incompatibilities: []
    availability_detection: "Always structurally available. Effective only when a harness adapter reports SUPPORTED compaction or fresh-context capability."
    risk: medium
    docs_ref: "docs/context-transition.md"
    agent_may_recommend: true
    agent_may_activate_config: true
    user_approval_required: false
    notes: "Coordinator script: scripts/Invoke-MxAgileContextTransition.ps1. Capability discovery: scripts/Get-MxAgileTransitionCapabilities.ps1. Risk is medium because incorrect transition can interrupt long-running tasks."

  - id: compact_current_session
    name: "Compact Current Session"
    description: "Harness-native compaction of the current session context while preserving mission state."
    category: context-lifecycle
    version_introduced: "1.7"
    default_state: "off"
    config_location: ".mxagile/config.yaml"
    config_key: "context_lifecycle.transition.compact.enabled"
    activation_mechanism: "Enable context_transition. Effective only when harness adapter reports programmatic or native auto-compaction SUPPORTED."
    requires: [context_transition]
    external_dependencies: []
    incompatibilities: []
    availability_detection: "Run Get-MxAgileTransitionCapabilities.ps1. CompactCurrentSession.Supported=true AND live_validation_status not UNSUPPORTED."
    risk: medium
    docs_ref: "docs/context-transition.md"
    agent_may_recommend: true
    agent_may_activate_config: false
    user_approval_required: false
    notes: "OpenCode: LIVE_HARNESS_UNVERIFIED (programmatic, completion-observable). Claude Code: LOCALLY_VERIFIED (native auto via PreCompact hook). Copilot: UNSUPPORTED. See .mxagile/adapters/*/transition-adapter.yaml."

  - id: fresh_context_epoch
    name: "Fresh Context Epoch Transition"
    description: "Transition to a fresh context epoch while preserving the MxAgile mission via checkpoint handoff."
    category: context-lifecycle
    version_introduced: "1.7"
    default_state: "off"
    config_location: ".mxagile/config.yaml"
    config_key: "context_lifecycle.transition.fresh_context.enabled"
    activation_mechanism: "Enable context_transition. Fresh context is always structurally possible when checkpoint_resume is enabled."
    requires: [context_transition]
    external_dependencies: []
    incompatibilities: []
    availability_detection: "Always structurally AVAILABLE when checkpoint_resume is ENABLED."
    risk: low
    docs_ref: "docs/context-transition.md"
    agent_may_recommend: true
    agent_may_activate_config: true
    user_approval_required: false
    notes: "Requires manual or harness-native fresh session creation. MxAgile writes the handoff checkpoint; the harness or user starts the new session."

  - id: autonomous_compaction
    name: "Autonomous Compaction"
    description: "Fully autonomous compaction without user intervention: reliable pressure + safe boundary + supported trigger + observable completion."
    category: context-lifecycle
    version_introduced: "1.7"
    default_state: "off"
    config_location: ".mxagile/config.yaml"
    config_key: "context_lifecycle.transition.autonomous"
    activation_mechanism: "Enable context_transition and set context_lifecycle.transition.autonomous: true. All four conditions must be met: pressure state reliable, safe boundary, supported trigger, observable completion."
    requires: [context_transition, pressure_recommendations]
    external_dependencies: []
    incompatibilities: []
    availability_detection: "Run Get-MxAgileTransitionCapabilities.ps1 → AutonomousCompactionPossible=true AND context_lifecycle.transition.autonomous=true."
    risk: high
    docs_ref: "docs/context-transition.md"
    agent_may_recommend: true
    agent_may_activate_config: false
    user_approval_required: false
    notes: "High risk because autonomous compaction interrupts long-running work if triggered incorrectly. Enable only after manual and semi-manual paths are proven. Currently LOCALLY_VERIFIED for Claude Code (hook-based). LIVE_HARNESS_UNVERIFIED for OpenCode."

  - id: pre_compact_hook_integration
    name: "PreCompact Hook Integration"
    description: "Claude Code PreCompact lifecycle hook that persists MxAgile checkpoint before native compaction."
    category: context-lifecycle
    version_introduced: "1.7"
    default_state: "off"
    config_location: ".claude/settings.json"
    config_key: "hooks.PreCompact"
    activation_mechanism: "Add Invoke-MxAgilePreCompactionCheckpoint.ps1 as a PreCompact hook entry in .claude/settings.json. Requires user authorization."
    requires: [context_transition]
    external_dependencies:
      - id: claude_code_cli
        display_name: "Claude Code CLI"
        assessed_date: "2026-10-14"
    incompatibilities: []
    availability_detection: "Check .claude/settings.json for hooks.PreCompact entry containing Invoke-MxAgilePreCompactionCheckpoint.ps1."
    risk: low
    docs_ref: "docs/context-transition.md"
    agent_may_recommend: true
    agent_may_activate_config: false
    user_approval_required: true
    notes: "Hook installation requires user authorization (mutates .claude/settings.json). LOCALLY_VERIFIED: hook structure verified. LIVE_HARNESS_UNVERIFIED: live PreCompact firing not tested in this session."

health_probe: "Type 'ctx stats' in Copilot Chat once; context-mode tools should appear and respond. 'context-mode doctor' in a shell for diagnostics."
setup_project: "npm install -g context-mode; create .vscode/mcp.json with servers.context-mode.command = context-mode; create .github/hooks/context-mode.json (PreToolUse/PostToolUse/SessionStart -> 'context-mode hook vscode-copilot <event>'); restart VS Code."
setup_global: "Not documented upstream for VS Code Copilot beyond the global npm binary."

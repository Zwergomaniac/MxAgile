# MxAgile Context Transition Adapter — Generic / Unknown Harness
# Assessed: 2026-10-14
# Schema: .mxagile/schemas/harness-adapter.schema.json → context_transition
#
# This adapter is the safe default when no specific harness is detected
# or when the detected harness has no registered transition adapter.
# All capabilities are UNSUPPORTED or UNKNOWN.
# This adapter always selects EXTERNAL_ACTION_REQUIRED as the fallback strategy.

adapter_version: "1.1"

context_transition:
  harness_id: generic
  harness_version: null
  assessed_date: "2026-10-14"
  upstream_docs_ref: null
  session_id_visibility: unknown

  context_usage:
    supported: false
    measurement_type: unknown
    source: unknown
    freshness: unknown

  compact_current_session:
    supported: false
    automatic_supported: false
    programmatic_supported: false
    provider_native_supported: false
    completion_observable: false
    idempotency_supported: false
    recent_tail_configurable: false
    programmatic_mechanism: null
    completion_mechanism: null
    live_validation_status: UNSUPPORTED
    notes: "Generic fallback adapter — no harness-specific compaction available."

  fresh_context:
    supported: false
    programmatic_supported: false
    resume_contract_handoff_supported: false
    live_validation_status: UNSUPPORTED

  hooks:
    pre_compact: UNSUPPORTED
    post_compact: UNSUPPORTED
    session_start_after_compact: UNSUPPORTED
    hook_config_path: null

fallback:
  selected_strategy: EXTERNAL_ACTION_REQUIRED
  reason: "No harness detected or no registered transition adapter."
  user_guidance: >
    MxAgile cannot autonomously compact in this session. A valid checkpoint
    has been written. Start a new agent session and load the checkpoint to
    continue the mission. See docs/context-transition.md for manual instructions.

# Canonical MxAgile Task
# Schema: .mxagile/schemas/task.schema.json
# Location: planning/tasks/TASK-NNN.yml
# ID must match filename stem exactly.
# 'spec' field creates an IMPLEMENTED_BY edge: Spec -> Task in the artifact index.

ID: TASK-001
spec: SPEC-001
req:
  - REQ-001
type: entity # entity | module | microflow | nanoflow | page | security | navigation | integration | other
action: "[Short description of what this task builds or changes]"
detail: >-
  [Detailed implementation notes: what to build, which module, which
  existing artifacts to modify, relevant constraints.]
depends_on: [] # list of TASK-ids that must complete first
status: pending # pending | in_progress | done | failed | blocked | deferred

test:
  role: AppAdmin
  steps:
    - open: Page_Name
    - click: Button_Name
  expected: "[Expected outcome after completing this task]"

# Optional: model inspection via mxcli
# inspect:
#   type: entity
#   target: Module.EntityName
#   expect: "[Expected model structure or logic]"
# Supported types: entity, microflow, association, rule, snippet, page.
# `expect` may be omitted only when no authoritative semantic expectation exists;
# acceptance then records target existence only and remains NOT_VERIFIED.
# inspect:
#   type: microflow
#   target: Module.SUB_FlowName
#   expect: "[Expected model structure or logic]"

# MxAgile Framework Configuration
# Managed by: MxAgile Core (scripts/install-core.ps1)
# Project-level overrides may extend this file; do not remove existing keys.

# ---------------------------------------------------------------------------
# Knowledge Graph
# Provider options:
#   artifact-index  — default, built deterministically from canonical YAML
#   none            — disables the graph entirely (graph-state.yaml: DISABLED)
# Phase 3 option (not yet active):
#   graphify        — optional Graphify integration; requires Graphify to be
#                     installed and configured separately
# ---------------------------------------------------------------------------
knowledge_graph:
  provider: artifact-index

  # Maximum BFS depth for affected() queries
  max_affected_depth: 10

  # If true, refresh() is called automatically before lifecycle re-sync orientation
  auto_refresh_on_resync: true

# ---------------------------------------------------------------------------
# Enrichment Provider (Phase 3 — optional overlay, NEVER replaces native graph)
# Options:
#   none     — no enrichment (default)
#   graphify — Graphify code-graph overlay; requires scripts/install-graphify.ps1
# ---------------------------------------------------------------------------
enrichment_provider: none

graphify:
  enabled: false
  # Output directory for graphify-generated graph.json (relative to project root)
  output_dir: graphify-out
  # Strip external API keys during build — enforces local-first operation
  local_only: true
  # Use 'graphify update' (AST-only, no LLM) for incremental builds
  incremental: true
  # Minimum acceptable graphify CLI version
  version_constraint: ">=0.9.28"

# ---------------------------------------------------------------------------
# Context Lifecycle
# Controls durable mission-state, Context Epochs, checkpoint/resume, and
# context-pressure management.
# All features are disabled by default for backward compatibility.
# Enable incrementally: checkpoint_resume → manual_rollover →
#   pressure_recommendations → auto_rollover (only when prior stages proven).
# Policy:        .mxagile/policies/context-lifecycle.md
# Schema:        .mxagile/schemas/context-epoch.schema.json
# Documentation: docs/context-lifecycle.md
# ---------------------------------------------------------------------------
context_lifecycle:
  # Master switch. When false all sub-features are inactive.
  enabled: false

  # Write and read planning/lifecycle/context-epoch.yaml
  checkpoint_resume: false

  # Allow manual Context Epoch rollover via explicit request
  manual_rollover: false

  # Emit pressure-level recommendations (PRESSURE / ROLLOVER_RECOMMENDED)
  pressure_recommendations: false

  # Automatically roll over at the next safe lifecycle boundary
  # Only activate after checkpoint_resume and manual_rollover are proven.
  auto_rollover: false

  # Context-pressure thresholds (in tokens).
  # null = threshold unknown — do not compute pressure from token count.
  # Supply values only when a harness or gateway can deliver reliable counts.
  # The 150k gateway observation is a measurement boundary for evaluation,
  # NOT a production threshold to hard-code here.
  pressure_thresholds:
    pressure_tokens: null
    rollover_recommended_tokens: null
    rollover_required_tokens: null

  # Storage locations (relative to project root).
  # Rationale for two-tier model:
  #   operational_dir: gitignored — written on every checkpoint, avoids git change noise
  #     and self-interference (git-status check is not polluted by the checkpoint write itself).
  #   handoff_dir: git-tracked — written only on explicit manual rollover or handoff request.
  #     Survives fresh clone. Creates git noise only when intentionally committed.
  storage:
    # Primary operational store (gitignored, durable locally).
    operational_dir: ".concord"
    epoch_filename: "context-epoch.yaml"
    # Explicit handoff/audit store (git-tracked).
    # Written only on -WriteHandoffCopy or manual rollover request.
    handoff_dir: "planning/lifecycle"
    # Legacy key — kept for backward compatibility; semantically superseded by operational_dir.
    canonical_dir: "planning/lifecycle"
    scratch_dir: ".concord/scratch"

  # Model capability profiles (relative to .mxagile/).
  # Separates physical model capability from working-context policy.
  model_profiles: "model-profiles.yaml"

  # Harness adapter contract schema (relative to .mxagile/schemas/).
  # Defines the generic interface for harness/provider integration.
  harness_adapter_schema: "harness-adapter.schema.json"

  # Natural lifecycle boundary classes eligible for opportunistic rollover.
  # Rollover below numeric pressure threshold is permitted when a
  # particularly clean lifecycle boundary exists AND the policy determines
  # that rollover provides value at this boundary.
  # Set to empty list to disable opportunistic rollover entirely.
  natural_rollover_boundaries:
    - "discovery_to_implementation"
    - "implementation_to_verification"
    - "debugging_resolution_to_acceptance"
    - "completed_work_package_to_next"

  # Pilot configuration reference.
  # To enable mature manual features without automatic rollover:
  #   context_lifecycle:
  #     enabled: true
  #     checkpoint_resume: true
  #     manual_rollover: true
  #     pressure_recommendations: true
  #     auto_rollover: false

  # Extension points (future — not active in this implementation)
  # warm_retrieval_provider: none     # future: rtk
  # compression_provider: none        # future: context_mode
  # token_counter: none               # future: api

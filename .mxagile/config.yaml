# MxAgile Framework Configuration
# Managed by: MxAgile Core (scripts/install-core.ps1)
# Project-level overrides may extend this file; do not remove existing keys.

# ---------------------------------------------------------------------------
# Knowledge Graph
# Provider options:
#   artifact-index  — default, built deterministically from canonical YAML
#   none            — disables the graph entirely (graph-state.yaml: DISABLED)
# Phase 3 option (not yet active):
#   graphify        — optional Graphify integration; requires Graphify to be
#                     installed and configured separately
# ---------------------------------------------------------------------------
knowledge_graph:
  provider: artifact-index

  # Maximum BFS depth for affected() queries
  max_affected_depth: 10

  # If true, refresh() is called automatically before lifecycle re-sync orientation
  auto_refresh_on_resync: true

# ---------------------------------------------------------------------------
# Enrichment Provider (Phase 3 — optional overlay, NEVER replaces native graph)
# Options:
#   none     — no enrichment (default)
#   graphify — Graphify code-graph overlay; requires scripts/install-graphify.ps1
# ---------------------------------------------------------------------------
enrichment_provider: none

graphify:
  enabled: false
  # Output directory for graphify-generated graph.json (relative to project root)
  output_dir: graphify-out
  # Strip external API keys during build — enforces local-first operation
  local_only: true
  # Use 'graphify update' (AST-only, no LLM) for incremental builds
  incremental: true
  # Minimum acceptable graphify CLI version
  version_constraint: ">=0.9.28"

# ---------------------------------------------------------------------------
# Context Lifecycle
# Controls durable mission-state, Context Epochs, checkpoint/resume, and
# context-pressure management.
# All features are disabled by default for backward compatibility.
# Enable incrementally: checkpoint_resume → manual_rollover →
#   pressure_recommendations → auto_rollover (only when prior stages proven).
# Policy:        .mxagile/policies/context-lifecycle.md
# Schema:        .mxagile/schemas/context-epoch.schema.json
# Documentation: docs/context-lifecycle.md
# ---------------------------------------------------------------------------
context_lifecycle:
  # Master switch. When false all sub-features are inactive.
  # DEFAULT POLICY (MxAgile 1.6, post-acceptance):
  #   NEW installations: enable enabled/checkpoint_resume/manual_rollover/pressure_recommendations.
  #   auto_rollover remains false — enable only after manual rollover is proven.
  #   Existing installations: upgrade contract requires explicit opt-in via project migration.
  #   Safe defaults for new installations are documented in docs/installation.md.
  enabled: false

  # Write and read planning/lifecycle/context-epoch.yaml
  checkpoint_resume: false

  # Allow manual Context Epoch rollover via explicit request
  manual_rollover: false

  # Emit pressure-level recommendations (PRESSURE / ROLLOVER_RECOMMENDED)
  # Note: pressure state is UNKNOWN when no reliable measurement exists.
  # Recommendations may be enabled while pressure remains UNKNOWN — they will report
  # UNKNOWN state rather than invent measurements.
  pressure_recommendations: false

  # Automatically roll over at the next safe lifecycle boundary
  # Only activate after checkpoint_resume and manual_rollover are proven.
  # REMAINS false by default — even in new installations.
  auto_rollover: false

  # Context-pressure thresholds (in tokens).
  # null = threshold unknown — do not compute pressure from token count.
  # Supply values only when a harness or gateway can deliver reliable counts.
  # The 150k gateway observation is a measurement boundary for evaluation,
  # NOT a production threshold to hard-code here.
  pressure_thresholds:
    pressure_tokens: null
    rollover_recommended_tokens: null
    rollover_required_tokens: null

  # Storage locations (relative to project root).
  # Rationale for two-tier model:
  #   operational_dir: gitignored — written on every checkpoint, avoids git change noise
  #     and self-interference (git-status check is not polluted by the checkpoint write itself).
  #   handoff_dir: git-tracked — written only on explicit manual rollover or handoff request.
  #     Survives fresh clone. Creates git noise only when intentionally committed.
  storage:
    # Primary operational store (gitignored, durable locally).
    operational_dir: ".concord"
    epoch_filename: "context-epoch.yaml"
    # Explicit handoff/audit store (git-tracked).
    # Written only on -WriteHandoffCopy or manual rollover request.
    handoff_dir: "planning/lifecycle"
    # Legacy key — kept for backward compatibility; semantically superseded by operational_dir.
    canonical_dir: "planning/lifecycle"
    scratch_dir: ".concord/scratch"

  # Model capability profiles (relative to .mxagile/).
  # Separates physical model capability from working-context policy.
  model_profiles: "model-profiles.yaml"

  # Harness adapter contract schema (relative to .mxagile/schemas/).
  # Defines the generic interface for harness/provider integration.
  harness_adapter_schema: "harness-adapter.schema.json"

  # Natural lifecycle boundary classes eligible for opportunistic rollover.
  # Rollover below numeric pressure threshold is permitted when a
  # particularly clean lifecycle boundary exists AND the policy determines
  # that rollover provides value at this boundary.
  # Set to empty list to disable opportunistic rollover entirely.
  natural_rollover_boundaries:
    - "discovery_to_implementation"
    - "implementation_to_verification"
    - "debugging_resolution_to_acceptance"
    - "completed_work_package_to_next"

  # Pilot configuration reference.
  # To enable mature manual features without automatic rollover:
  #   context_lifecycle:
  #     enabled: true
  #     checkpoint_resume: true
  #     manual_rollover: true
  #     pressure_recommendations: true
  #     auto_rollover: false

  # ---------------------------------------------------------------------------
  # Context Transition (MxAgile 1.7)
  # Autonomous context compaction and fresh-epoch transition coordination.
  # Requires: context_lifecycle.enabled + context_lifecycle.checkpoint_resume
  # Policy:        .mxagile/policies/context-transition.md
  # Documentation: docs/context-transition.md
  # Registry:      .mxagile/capabilities.yaml (context_transition et al.)
  # ---------------------------------------------------------------------------
  transition:
    # Master switch for the transition coordinator.
    # When false: no autonomous transition is initiated.
    # Manual rollover (manual_rollover: true) still functions independently.
    enabled: false

    # When true: MxAgile may initiate transitions autonomously without asking
    # the user, provided all conditions are met (pressure reliable, safe
    # boundary, supported trigger, observable completion).
    # Enable ONLY after manual/hook-based flows are proven.
    autonomous: false

    # Strategy preference order. First supported strategy is used.
    # Options: compact_current_session | fresh_context_epoch | external_action_required
    preferred_strategies:
      - compact_current_session
      - fresh_context_epoch
      - external_action_required

    compact:
      # Allow compact_current_session strategy.
      enabled: true

      # Require a valid checkpoint before triggering compaction.
      require_valid_checkpoint: true

      # Require a safe lifecycle boundary before compaction.
      require_safe_boundary: true

      # Harness-specific: number of recent tokens to preserve.
      # null = harness default. Do not hard-code a universal value.
      recent_tail_tokens: null

      # Harness-specific: buffer below context limit before compaction.
      # null = harness default.
      buffer_tokens: null

    fresh_context:
      # Allow fresh_context_epoch strategy.
      enabled: true

    # External action fallback: always available.
    external_action_fallback: true

  # Extension points (future — not active in this implementation)
  # warm_retrieval_provider: none     # future: context_mode
  # token_counter: none               # future: api

# ---------------------------------------------------------------------------
# Context Optimization (MxAgile 1.5)
# Optional adapters that reduce token consumption without affecting lifecycle,
# evidence, checkpoint or mission-state authority.
# MxAgile remains the sole authority for all lifecycle decisions.
# Both adapters are independent; either may be enabled alone.
# Policy:        .mxagile/integrations/rtk.yaml
#                .mxagile/integrations/context-mode.yaml
# Documentation: docs/context-optimization.md
# Registry:      .mxagile/capabilities.yaml
# ---------------------------------------------------------------------------
context_optimization:
  # Master switch. When false both adapters are inactive regardless of sub-keys.
  enabled: false

  rtk:
    # Enable RTK command-output optimization (Bash tool calls only).
    # Requires: RTK >=0.37.2 installed and 'rtk init -g' hook wired.
    # Install:  winget install rtk-ai.rtk  (Windows)
    #           brew install rtk           (macOS/Linux)
    enabled: false

    # When true, MxAgile preserves raw command output for LOSSLESS_REQUIRED
    # commands alongside any RTK-optimized representation.
    preserve_raw_evidence: true

    output_safety:
      # Default classification when no explicit override matches.
      # COMPACT_SAFE  — compact representation preserves actionable result.
      # LOSSLESS_REQUIRED — raw output must be preserved (evidence-critical).
      # BYPASS        — pass through without optimization.
      default_classification: COMPACT_SAFE

      # Command patterns that require raw evidence preservation.
      # These map to LOSSLESS_REQUIRED regardless of RTK's output.
      lossless_required_patterns:
        - "playwright"
        - "mxcli run"
        - "mxcli test"

  context_mode:
    # Enable Context Mode WARM-context externalization and retrieval.
    # Requires: context-mode npm package installed (ELv2 — not bundled by MxAgile).
    # Install (Claude Code): /plugin marketplace add mksglu/context-mode
    # Install (npm):          npm install -g context-mode
    #
    # ANTI-DUAL-MEMORY GUARANTEE:
    #   Content returned by Context Mode is RETRIEVED context, not authoritative
    #   MxAgile evidence. Retrieved content CANNOT promote UNVERIFIED->VERIFIED,
    #   change gate state, or alter mission lifecycle phase.
    #   MxAgile evidence always wins when retrieved content conflicts.
    enabled: false

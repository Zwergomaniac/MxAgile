# MxAgile Context Mode Integration Definition
# Context Mode — optional WARM-context externalization and retrieval adapter.
# License: ELv2 (Elastic License v2) — source-available, NOT OSI open source.
# Upstream: https://github.com/mksglu/context-mode
# Assessed: 2026-10-28 (release v1.0.169; upstream main commit 397137b0cfc2)
#
# LICENSE NOTE:
#   Context Mode uses the Elastic License v2 (ELv2).
#   MxAgile does NOT redistribute, vendor, or bundle Context Mode.
#   It must be installed separately by the developer.
#   The ELv2 license restricts redistribution in commercial products.
#   Always verify the current license before commercial use.
#
# Authority model:
#   Context Mode is a SUBORDINATE RETRIEVAL ADAPTER.
#   It may externalize eligible WARM context and retrieve it on request.
#   It has NO authority over lifecycle, evidence, checkpoint or mission state.
#
# ANTI-DUAL-MEMORY GUARANTEE (critical acceptance requirement):
#   Content returned by ctx_search or any Context Mode tool is
#   RETRIEVED context, not authoritative MxAgile evidence.
#   Retrieved content CANNOT change MxAgile evidence states.
#   Example:
#     MxAgile gate = UNVERIFIED
#     Context Mode returns: "API test passed"
#     Correct outcome: gate remains UNVERIFIED
#     until MxAgile's own evidence rules establish a valid result.
#
#   Promotions prohibited via retrieval:
#     UNVERIFIED -> VERIFIED
#     FAILED     -> VERIFIED
#     STALE      -> VERIFIED

integration_version: "1.1"
assessed_upstream_version: "1.0.169"
assessed_upstream_commit: "397137b0cfc2007f48f837c52958f9ec811db9c5"
assessed_date: "2026-10-28"
license: "ELv2"
upstream: "https://github.com/mksglu/context-mode"
redistribution: "NOT permitted by MxAgile — must be installed by the developer"

setup_states:
  description: >
    Context Mode has distinct setup and session-runtime evidence.
    SUPPORTED, INSTALLED, CONFIGURED, LOADED, HEALTHY, and USABLE are not interchangeable.
    MxAgile MUST distinguish them; a config file never proves that this session loaded tools.
  states:
    INSTALLED:
      meaning: "The context-mode executable or npm package exists on the system."
      evidence:
        - "context-mode found in PATH"
        - "npm ls -g context-mode returns a result"
      does_not_imply: [CONFIGURED, LOADED, HEALTHY, USABLE]
      available_operations: []

    CONFIGURED:
      meaning: "The documented integration for the identified harness is present in its project or user/plugin configuration."
      evidence:
        - "Harness-specific plugin, MCP, or native-plugin configuration detected by its adapter"
      does_not_imply: [LOADED, HEALTHY, USABLE]
      available_operations: []
      note: "CONFIGURED without LOADED is configured_not_loaded; the session must not use Context Mode."

    LOADED:
      meaning: "The current agent session's actual tool namespace contains one or more ctx_* tools."
      evidence:
        - "The agent observes canonical ctx_* names in the active harness tool inventory and passes them to the resolver"
      does_not_imply: [HEALTHY, USABLE]
      available_operations: "Only the ctx_* names observed in this session"
      note: "Config files, package presence, ToolSearch results from another session, and concord_discover are not LOADED evidence."

    HEALTHY:
      meaning: "One bounded ctx_doctor probe succeeded in this same session after LOADED was observed; required harness hooks are healthy where applicable."
      evidence:
        - "ctx_doctor result observed in this session with all relevant runtime checks passing"
      does_not_imply: [USABLE]
      available_operations: []

    USABLE:
      meaning: "Supported, installed, configured, loaded, healthy, enabled in MxAgile, and all task-required ctx_* operations are present."
      evidence:
        - "All preceding evidence belongs to the current session/project"
        - "The resolver confirms context_optimization.context_mode.enabled"
        - "The resolver confirms every ContextModeRequiredTools entry exists in the observed tool inventory"
      available_operations: "Only the task-required ctx_* operations observed in this session"
      note: "USABLE is task-specific. MxAgile ACTIVE additionally reflects the capability state; neither state grants lifecycle authority."

  resolution_algorithm:
    step_1: "For a relevant task, query the MxAgile resolver first for context_mode_integration."
    step_2: "Inspect the actual active harness tool inventory; do not substitute ToolSearch guesses, concord_discover, config files, or another session."
    step_3: "Pass -ContextModeToolsObserved and the canonical current-session ctx_* names to the resolver; an explicitly empty inventory means not_loaded."
    step_4: "Only when loaded, run at most one bounded ctx_doctor probe and pass its result to the same resolver invocation."
    step_5: "Pass the operation(s) required by this task; USABLE requires all of them plus MxAgile enabled. Otherwise use the native fallback."
    final_states: [NOT_PRESENT, INSTALLED, CONFIGURED, LOADED, HEALTHY, USABLE]

  authoring_tool:
    name: ctx_index
    purpose: "Chunk content into the FTS5/BM25 knowledge base for WARM context externalization"
    required_state: ACTIVE
    note: >
      ctx_index is the correct tool for WARM context authoring.
      Do NOT use ctx_store — that tool does not exist in this integration.
      The authoritative tool list is mcp_tools.available below.

detection:
  executables:
    - context-mode
    - npx_package: context-mode
  version_command: "context-mode --version"
  version_pattern: "(\\d+\\.\\d+\\.\\d+)"
  minimum_version: "1.0.33"
  claude_code_plugin: "mksglu/context-mode"
  plugin_verify_slash_command: "/context-mode:ctx-doctor"
  mcp_tool_probe: "ctx_doctor"
  setup_state_resolution: "See setup_states.resolution_algorithm above"
  important: "Executable in PATH alone does NOT imply ACTIVE or LOADED. Use resolution_algorithm."

harness_integration:
  description: >
    Context Mode is integrated differently per harness. The same MCP stdio config is NOT valid
    everywhere. Detection is read-only and lives in scripts/Get-MxAgileCapabilities.ps1
    (capability context_mode_integration, JSON field `integration`); per-harness setup/repair/health
    guidance lives in the platform adapters. The resolver never mutates configuration. An agent may
    make an explicitly authorized, reversible project-local setup change; user/global installation
    and configuration always require approval.
  adapters:
    claude_code: ".mxagile/adapters/claude/context-mode.yaml"
    copilot_cli: ".mxagile/adapters/copilot/context-mode-cli.yaml"
    vscode_copilot: ".mxagile/adapters/copilot/context-mode-vscode.yaml"
    opencode: ".mxagile/adapters/opencode/context-mode.yaml"
  upstream_forms:
    claude_code: "plugin (hooks + 11 MCP tools) or MCP-only (tools, no hooks)"
    copilot_cli: "copilot plugin (MCP + hooks) or manual (copilot mcp add + ~/.copilot/hooks/context-mode.json)"
    vscode_copilot: "project files .vscode/mcp.json + .github/hooks/context-mode.json, global context-mode binary"
    opencode: "native in-process plugin via opencode.json plugin [context-mode]; NOT a stdio MCP server"
  opencode_conflict: >
    plugin ["context-mode"] together with mcp.context-mode makes OpenCode register zero ctx_* tools
    (upstream upgrade note). MxAgile reports status misconfigured (degraded, not usable) and does not
    delete or repair the entry. Legacy mcp.context-mode without plugin is reported as legacy_mcp (degraded).
  harness_id_resolution: >
    MXAGILE_HARNESS is a per-process current-session host attestation; CLAUDECODE=1 and
    OPENCODE_SESSION_ID/OPENCODE_BASE_URL are strong runtime markers. -Harness is only an assertion:
    it requires matching current-session evidence. Unattested or conflicting values resolve to
    harness_ambiguous. Copilot CLI and VS Code Copilot have no reliable shared process marker, so the
    active host adapter supplies MXAGILE_HARNESS; config files, Concord tools, COPILOT_HOME, WT_SESSION,
    VSCODE terminal variables, and terminal origin are not host identity evidence.
  status_values:
    not_installed: "Supported but no runtime/config for this harness -> unavailable; setup guidance."
    installed_not_configured: "Runtime present, not configured for this harness -> available, not active; setup guidance."
    configured_runtime_missing: "Harness config is present but its required runtime executable is absent -> unavailable with install guidance, not a session-reload hint."
    misconfigured: "Config present but known-broken (conflict, inert hooks) -> degraded, not usable."
    configured_load_unknown: "Config present, but current-session tool inventory was not observed -> not usable."
    configured_not_loaded: "Config present, current-session inventory explicitly has no ctx_* tools -> restart/reload guidance; not usable."
    loaded_health_unknown: "Current-session ctx_* tools observed, health unknown -> not usable."
    loaded_unhealthy: "Current-session ctx_* tools observed, probe failed or timed out -> degraded, not usable."
    loaded_hooks_missing: "Current-session tools loaded but required harness routing hooks are absent -> not usable."
    task_tools_missing: "Healthy and loaded, but one or more task-required operations are absent -> not usable for this task."
    task_fit_unknown: "Healthy and loaded, but no task-required operations were supplied -> task fit remains unverified."
    healthy: "Health succeeded; usable is true only when configured, loaded, MxAgile-enabled, and task-required tools are present."
    healthy_but_disabled: "Loaded and healthy, but MxAgile configuration is disabled -> not usable."
    loaded_unconfigured: "Tools observed but supported harness configuration was not detected -> configuration unverified, not usable."
    harness_unknown: "Harness not identified -> not usable, degraded when enabled."
    harness_ambiguous: "Caller assertion lacks current-session evidence or contradicts runtime markers -> not usable; do not retry with a guess."
    harness_unsupported: "No adapter for this harness -> unavailable."
  mapping_to_capability_states:
    available: "A runtime for the identified harness exists. NOT proof the integration works."
    enabled: "context_optimization.context_mode.enabled in project config."
    degraded: "Configured but not loaded, unhealthy, misconfigured, or task suitability unverified."
    active: "available AND enabled AND integration.usable; usability also requires task-specific tool evidence."
  health:
    evidence_source: "Agent-observed result of ONE bounded ctx_doctor call in the same session, passed as -ContextModeHealth healthy|failed|timeout together with observed tools. The resolver performs no MCP call."
    rules:
      - "At most once per session (cache the result); never per model turn."
      - "No large output; no blocking startup wait; a timeout is recorded as 'timeout' and the session continues natively."
      - "Health without current-session ctx_doctor in the observed tool inventory is ignored; absent evidence stays 'unknown' and is never reported as healthy."
      - "A healthy result confirms hooks only when the harness adapter says hooks are expected and ctx_doctor reports them healthy."
      - "Evidence is not persisted or reused across sessions."
  runtime_loading:
    tools_observed_parameter: "-ContextModeToolsObserved marks that the live harness inventory was inspected; omit it when unknown."
    tools_parameter: "-ContextModeTools accepts only canonical ctx_* names seen in this session."
    required_tools_parameter: "-ContextModeRequiredTools lists the operation(s) required by the current task; all must be present for usable."
    hooks_required_parameter: "-ContextModeHooksRequired marks tasks that need automatic routing; direct ctx_* tasks may be usable without hooks."
    hooks_parameter: "components.hooks_loaded is true only after loaded tools and a successful same-session ctx_doctor, false when hooks are absent, otherwise null/unknown."
    concord: "concord_discover may discover Concord tools but is not a substitute for MxAgile capability resolution or live ctx_* evidence."
    terminal_origin: "Terminal origin is not part of capability semantics; equal project/config/session evidence yields equal results."
  setup_guidance_rules:
    - "Guidance comes from the adapter file of the identified harness; project-local vs global paths are stated separately where upstream documents both."
    - "Configured but not loaded guidance names the harness-specific reload or session restart; do not retry in a loop."
    - "MCP-only may be usable for this task when required direct tools are loaded and hooks are not required; when hooks are required, name the approved plugin setup and required reload."
    - "The agent states the setup path compactly and continues with the native fallback."
    - "Never install a global package/plugin, edit user-global config, or change credentials without explicit user approval."

ownership:
  repo_git_tracked:
    framework_contracts: ["scripts/Get-MxAgileCapabilities.ps1", ".mxagile/integrations/context-mode.yaml", ".mxagile/adapters/*/context-mode*.yaml", ".mxagile/policies/capability-discovery.md"]
    claude_code: "Project .mcp.json is supported for intentional MCP-only setup; it has tools but no hooks. Marketplace installation and plugin cache stay user-owned."
    copilot_cli: "No upstream-documented project-local setup; MCP, hooks, and plugin installation live under COPILOT_HOME or ~/.copilot."
    vscode_copilot: "Project .vscode/mcp.json and .github/hooks/context-mode.json are supported project files; the context-mode executable is user/machine-installed."
    opencode: "Project opencode.json plugin [context-mode] is supported; do not add a parallel legacy mcp.context-mode entry."
  user_machine_owned:
    - "Global npm/package installation and marketplace/plugin installation or cache"
    - "User-global harness configuration, credentials, and authentication"
    - "Context Mode SQLite content/session databases, stats, cache, and process files under the user profile"
  session_owned:
    - "The current live ctx_* tool inventory and runtime availability"
    - "The current-session ctx_doctor health result and loaded/hooks-loaded evidence"
    - "Session-specific Context Mode state; never persist as project truth or commit"

self_service_policy:
  SAFE_AUTOMATIC: "Read-only diagnosis. A reversible project-local config/ignore change is allowed only when the user's request authorizes that project setup and existing MxAgile autonomy rules permit it; preserve unrelated content and secrets."
  REQUIRES_USER_APPROVAL: "Global package/plugin installation, marketplace actions, user-global configuration, credentials, and durable machine-level mutations. No silent execution."
  REQUIRES_RESTART: "Configuration is correct but current-session tools are absent: report the exact harness reload/restart once; do not retry or claim health."
  UNSUPPORTED: "Do not invent a workaround; use the normal MxAgile fallback."
  output_fields: "integration.action_classification is SAFE_AUTOMATIC, REQUIRES_USER_APPROVAL, REQUIRES_RESTART, or UNSUPPORTED; integration.restart_required states the reload contract."

git_tracking:
  upstream_default: "SQLite content/session state and stats live outside the project under the user profile; they are not MxAgile project artifacts."
  project_local_runtime_ignores: [".context-mode/", ".github/context-mode/"]
  rule: "Ignore the whole runtime root, never PID-specific files. Core install/update adds these entries without replacing existing .gitignore content. If CONTEXT_MODE_DIR is redirected to another workspace path, ignore that entire configured root."
  tracked_exceptions: "Only intentional harness configuration and MxAgile source/adapter contracts are versioned; loaded tools, health, runtime cache, credentials, session DBs, PID and stats are not."

installation:
  claude_code: "/plugin marketplace add mksglu/context-mode"
  npm_global: "npm install -g context-mode"
  mcp_only: "claude mcp add context-mode -- npx -y context-mode"
  note: "ELv2 license — review before commercial use. Installation requires explicit user authorization."
  harness_specific: "See harness_integration.adapters — the commands above are Claude Code / generic only."

mcp_tools:
  available:
    - id: ctx_doctor
      purpose: "Diagnose Context Mode health, hooks, FTS5, versions"
      mxagile_use: health_check
    - id: ctx_index
      purpose: "Chunk content into FTS5/BM25 knowledge base"
      mxagile_use: externalize_warm_context
    - id: ctx_search
      purpose: "Query indexed content via BM25 + fuzzy search"
      mxagile_use: retrieve_warm_context
    - id: ctx_execute
      purpose: "Run code in an isolated subprocess sandbox"
      mxagile_use: not_used_for_lifecycle
    - id: ctx_execute_file
      purpose: "Process a project file in the sandbox without returning its raw contents"
      mxagile_use: task_specific_processing
    - id: ctx_fetch_and_index
      purpose: "Fetch, chunk, and index web content for bounded retrieval"
      mxagile_use: task_specific_processing
    - id: ctx_batch_execute
      purpose: "Multi-command execution in one call"
      mxagile_use: not_used_for_lifecycle
    - id: ctx_stats
      purpose: "Session savings, call counts, cache performance"
      mxagile_use: diagnostics
    - id: ctx_upgrade
      purpose: "Upgrade and repair Context Mode"
      mxagile_use: maintenance
    - id: ctx_purge
      purpose: "Clear indexed knowledge base"
      mxagile_use: maintenance
    - id: ctx_insight
      purpose: "Open the Context Mode Insight dashboard"
      mxagile_use: diagnostics

context_mapping:
  HOT:
    owner: MxAgile
    description: "Mission-critical state always present. Never externalized to Context Mode."
    examples:
      - mission objective and scope
      - lifecycle phase
      - Context Epoch and epoch ID
      - open gates and their states
      - blockers and user overrides
      - evidence states (VERIFIED/FAILED/UNVERIFIED/STALE/SUPERSEDED)
      - next action
      - Resume Contract

  WARM:
    eligible_for_externalization: true
    description: "Historical or bulky content not required on every turn. May be externalized and retrieved on demand."
    examples:
      - historical analyses and exploratory search results
      - earlier debugging findings no longer in active scope
      - older tool-result detail superseded by later findings
      - contextual background information
    notes: "Externalized WARM content is RETRIEVED context when recalled. It cannot directly update MxAgile evidence."

  COLD:
    owner: MxAgile
    description: "Canonical evidence artifacts. Context Mode may help locate them but cannot replace their canonical storage."
    examples:
      - raw test logs
      - acceptance reports
      - screenshots
      - runtime traces
      - test artifacts and fixtures
    notes: "Context Mode may help find COLD artifacts. It does not replace canonical storage in planning/lifecycle/ or .concord/."

storage:
  persistence: "SQLite at ~/.context-mode/ (default)"
  override: "CONTEXT_MODE_DIR environment variable"
  cleanup: "Content DBs older than 14 days removed on startup"
  fresh_session: "Prior session data deleted immediately on new session (without --continue)"

anti_dual_memory_guarantee:
  rule: "Retrieved content is never authoritative MxAgile evidence."
  prohibited_promotions:
    - "UNVERIFIED -> VERIFIED via retrieval"
    - "FAILED -> VERIFIED via retrieval"
    - "STALE -> VERIFIED via retrieval"
  required_behavior: >
    When Context Mode returns historical text that appears to confirm a result,
    the agent MUST treat it as unverified background information.
    MxAgile gate/mission state changes require fresh evidence evaluated by
    MxAgile's own evidence rules, not recalled text.
  test_reference: "tests/test-anti-dual-memory.ps1"

fallback:
  triggers:
    - "Context Mode not installed"
    - "Context Mode disabled"
    - "Context Mode unavailable or unhealthy"
    - "Context Mode returns no relevant result"
    - "Context Mode temporarily fails"
    - "Context Mode installed but not configured for the current harness"
    - "Context Mode not loaded in this session"
    - "Health probe failed or timed out"
    - "Harness unknown or unsupported"
  behavior: "Fall back to native MxAgile Context Lifecycle operation."
  order:
    - "existing deterministic helpers"
    - "scoped/bounded semantic delegation (if required and available)"
    - "targeted direct read"
  forbidden: "Full-repository read as automatic fallback."
  test_reference: "tests/test-context-mode-harness.ps1"
  must_not_block:
    - Resume
    - Re-Sync
    - Checkpoint validation
    - Evidence access through canonical references
    - Normal agent operation

epoch_integration:
  before_rollover:
    step_1: "Preserve required COLD evidence (MxAgile)"
    step_2: "Preserve authoritative HOT mission state (MxAgile)"
    step_3: "Optionally externalize eligible WARM material via ctx_index (if Context Mode active)"
    step_4: "Checkpoint MxAgile mission state (MxAgile)"
    step_5: "Validate checkpoint (MxAgile)"
    step_6: "Close Epoch using MxAgile lifecycle"
  after_rollover:
    step_1: "Load MxAgile Resume Contract"
    step_2: "Perform Re-Sync"
    step_3: "Reconstruct minimal HOT state"
    optional_step_4: "Retrieve relevant WARM context via ctx_search if needed"

mxagile_authority_contract:
  context_mode_may_not:
    - "Determine VERIFIED / FAILED / UNVERIFIED / STALE / SUPERSEDED evidence states"
    - "Decide gate completion"
    - "Decide mission completion"
    - "Decide lifecycle phase"
    - "Decide whether Re-Sync may be skipped"
    - "Replace canonical MxAgile evidence artifacts in planning/lifecycle/ or .concord/"
    - "Serve as the mission memory authority"
  context_mode_may:
    - "Externalize eligible WARM context for later retrieval"
    - "Return historical text as retrieved background context"
    - "Help locate COLD evidence artifacts"
    - "Provide session statistics and diagnostics"
    - "Execute sandboxed code for exploration (ctx_execute)"

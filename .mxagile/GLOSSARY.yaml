metadata:
  title: MxAgile Mendix Glossary
  purpose: Core terminology and delivery guidance for AI assistants on MxAgile-enabled Mendix projects.
  scope: Part of MxAgile Core. Defines generic MxAgile and Mendix concepts only.
         Company-specific terminology is provided by installed Company Layers (.mxagile/layers/).
  precedence:
    - Project-specific facts and decisions in projekt.md take precedence for the project.
    - Installed Company Layer glossary files take precedence for company-specific terminology.
    - This glossary provides generic MxAgile and Mendix terminology only.

reading_order:
  - Read this glossary for MxAgile and Mendix terminology.
  - If Company Layers are installed (.mxagile/layers/), read the applicable layer glossary for company-specific platform and module terminology.
  - Record unresolved facts as ASSUMPTION or DECISION REQUIRED.

terms:
  implementation_planning:
    Change_Significance:
      category: Planning
      description: >
        Classification of the architectural scope of a Wave before implementation readiness.
        Determined at gate-to-ready. Drives architecture assessment depth.
        Does not trigger verification artifact creation — architecture and verification are independent.
      values:
        LOCAL: >
          Bounded change within an established capability/domain/module. Existing architecture
          and ownership remain valid. No new architecture decision required. GAP repair may stay
          on the bounded repair path.
        FEATURE: >
          Coherent product capability change within or adding to established architecture.
          Module and capability ownership must be explicitly stated before checklist generation.
        CROSS_CUTTING: >
          Affects multiple capabilities, modules, or shared cross-cutting concerns (security,
          persistence, audit, shared microflows/pages/snippets). Architecture ownership
          assessment required before readiness.
        ARCHITECTURALLY_SIGNIFICANT: >
          Creates, moves, or changes module/capability boundaries, security boundaries,
          integration boundaries, broadly shared components, or causes monolith growth.
          Explicit DEC-NNN (decision_type: architecture) required before readiness.
      agent_hint: >
        Classify at gate-to-ready using escalation triggers in policies/implementation-control.md.
        LOCAL requires no ownership fields. FEATURE+ requires ownership fields in execution-waves.md
        and checklist items. ARCHITECTURALLY_SIGNIFICANT requires a confirmed DEC-NNN.
        Do not escalate solely on number of files or requirements changed.
    Architecture_Ownership_Assessment:
      category: Planning
      description: >
        10-question assessment performed at gate-to-ready for FEATURE, CROSS_CUTTING, and
        ARCHITECTURALLY_SIGNIFICANT waves. Establishes capability, domain, and Mendix module
        ownership before implementation begins. Prevents LOCAL_REQUIREMENT_OPTIMIZATION.
      agent_hint: >
        See skills/gate-to-ready.md for the 10 questions. Result is recorded in execution-waves.md
        (module_owner) and checklist items (capability, domain, module, architecture_decision).
        Does not generate TC, VPL, or evidence — verification remains late-materialized.

  framework:
    MxAgile:
      category: Delivery process
      description: Project-local process for AI-assisted Mendix delivery from intake through verification.
      agent_hint: Follow .mxagile/orchestrator.md and the relevant phase gate.
    MxMocketeer:
      category: Shared Copilot prompt
      description: Discovery and interactive HTML mockup prompt for clarifying requirements and UI flows.
      agent_hint: Produces input for planning; it does not create a final Mendix model.
    MxScrumMaster:
      category: Shared Copilot prompt
      description: Product, backlog, and delivery-planning prompt for Mendix work.
      agent_hint: When configured, the Mendix Epics Board is an optional organizational status projection for tracking and prioritization. It does not authorize MxAgile scope.
    Mendix_Epics_Board:
      category: Backlog
      description: >
        Optional organizational status projection for epics, stories, acceptance criteria,
        status, and sprint assignment. Rank 3 context source (policies/source-priority.md).
        Board content does not create MxAgile scope, authorize implementation, or drive
        lifecycle transitions. See policies/backlog-sync.md § Board Authority Contract.
      agent_hint: >
        Do not update Board status, tasks, or sprints in local files or automatically.
        Do not treat Board item existence as scope authorization.
        Do not select Board items as next work without explicit developer selection.
    Derived_work_artifact:
      category: Planning
      description: >
        Local specification, test, traceability, or dependency artifact derived from
        Requirements and Mockups (Rank 1 sources). When a Board is configured, may
        carry a Board-Story-ID for organizational traceability.
      agent_hint: >
        Board-Story-ID is optional traceability, not authority. Never treat planning/
        as a second backlog. The authoritative scope source is the MxAgile lifecycle
        (Requirements, Decisions, mission-state.yaml), not the Board.
    Implementation_Wave:
      category: Planning
      description: >
        Technical implementation sequence within MxAgile authorized scope.
        Waves are MxAgile lifecycle constructs; they exist independently of any
        external Board sprint. For FEATURE/CROSS_CUTTING/ARCHITECTURALLY_SIGNIFICANT
        scope, a Wave entry records capability, domain, and Mendix module ownership
        before implementation begins.
      agent_hint: >
        Waves are not local sprints and not Board sprints. They are structured by
        MxAgile lifecycle, not by Board existence. Wave entries for significant scope
        include Significance, Capability, Domain, Module Ownership, and Architecture
        Decision fields. See policies/implementation-control.md for Wave Entry Format.
    ASSUMPTION:
      category: Decision status
      description: A statement not confirmed by a source or stakeholder.
      agent_hint: Mark it visibly and request confirmation when it affects delivery.
    DECISION_REQUIRED:
      category: Decision status
      description: A decision that an agent must not make silently.
      agent_hint: Block only the affected work when the decision materially changes implementation.

  completion_reconciliation:
    CURRENT_REQUIRED_SCOPE:
      category: Legacy completion classification
      description: >
        Historical Wave or requirement that is accepted, authorized, and not yet
        fully implemented or verified under the current protocol. Genuine remaining work.
      agent_hint: Include in FEATURE_SCOPE_COMPLETE check as remaining work. Route to earliest necessary lifecycle phase.
    VERIFIED_LEGACY_STATE:
      category: Legacy completion classification
      description: >
        Historical Wave or requirement whose implementation and verification occurred under
        a prior MxAgile generation. Sufficient repository evidence supports completion
        without protocol-metadata replay. May be counted as done for FEATURE_SCOPE_COMPLETE.
      agent_hint: >
        Requires: authorized scope, implementation artifacts, and at least one of
        (wave report, acceptance campaign, runtime/browser evidence, developer acceptance decision,
        or absorbing revision with acceptance evidence). Record reconciliation basis in
        process-state.yaml. Full criteria: policies/legacy-completion-reconciliation.md.
    DEFERRED_OUTSIDE_FEATURE_SCOPE:
      category: Legacy completion classification
      description: >
        Explicitly deferred scope belonging to a later release, NFR, go-live, or compliance
        activity. Does not block FEATURE_SCOPE_COMPLETE. May block RELEASE_READY.
      agent_hint: >
        Must have documented deferral authority (planning/decisions/ or mission-state.yaml).
        Undocumented deferrals are UNKNOWN_REQUIRES_RECONCILIATION.
    SUPERSEDED:
      category: Legacy completion classification
      description: >
        Requirement, revision, Design Contract, or plan replaced by a later accepted artifact.
        Retained for traceability. Not current scope. Does not create implementation work.
      agent_hint: >
        Trace to the superseding artifact. Do not delete the superseded artifact.
        Do not create work items from superseded scope without explicit re-authorization.
    GENUINE_DECISION_BLOCKER:
      category: Legacy completion classification
      description: >
        An open business decision, unresolved DECISION_REQUIRED, or human-authority gate
        that cannot be satisfied without stakeholder input. Blocks FEATURE_SCOPE_COMPLETE
        until resolved.
      agent_hint: Surface to developer with clear description of what decision is needed.
    UNKNOWN_REQUIRES_RECONCILIATION:
      category: Legacy completion classification
      description: >
        Authority or provenance of a historical artifact cannot be established from
        available evidence. A legitimate reconciliation blocker. Do not fabricate
        authorization. Do not count as scope until authority is established.
      agent_hint: >
        Preserve the artifact. Surface to developer. Do not create requirements,
        waves, or work items to resolve an UNKNOWN item without developer direction.

  security:
    SSO:
      description: Single Sign-On.
    OIDC:
      description: OpenID Connect.
    SAML:
      description: Security Assertion Markup Language.
    Entitlement:
      description: A package of access permissions.
    PID_User:
      description: Technical user for APIs and system integration.
      agent_hint: Do not use a personal account for system-to-system access.

  agile:
    PO:
      description: Product Owner.
    SM:
      description: Scrum Master.
    AO:
      description: Application Owner.
    ProjectAdmin:
      description: Person responsible for an application.
    GRA:
      description: Global Role Assigner.

  ai:
    Agent:
      description: AI system with tool usage and decision logic.
    MCP:
      description: Model Context Protocol.
    GenAICommons:
      description: Mendix GenAI Framework.
    AgentCommons:
      description: Mendix Agent Framework.
    Copilot:
      description: Microsoft AI Assistant.
    Claude:
      description: Anthropic AI Assistant.
    mxcli:
      description: Tool for Mendix MDL, validation, and checks.
      agent_hint: Follow project-local write and model-safety rules before executing model operations.
    Concord_MCP:
      description: Bridge between AI agents, Mendix Studio Pro, and project knowledge.
      agent_hint: It does not override project safety or model-protection rules.
    MPR_v2:
      description: Structured Mendix project representation with .mpr and mprcontents.
      agent_hint: Apply the project's materialization checks before and after model write operations.

principles:
  architecture:
    - Check installed Company Layer platform modules before proposing custom development (see .mxagile/layers/ if a layer is installed).
    - Check Mendix Marketplace or FOSS before proposing custom implementation.
    - Prefer configuration and extension points over customization of installed modules.
    - Define and respect the system of record for every integration.
  security:
    - Apply security by design and least privilege.
    - Prefer corporate IAM and confirmed role concepts over local user management.
    - Never store credentials in source code or versioned template artifacts.
  development:
    - Use Mendix standard modules and documented platform modules before custom code.
    - Keep microflows simple and prefer maintainability over accidental complexity.
  ai_projects:
    - Confirm responsible AI assessment, human accountability, model usage, and compliance requirements before productive AI functionality.

agent_rules:
  - Check whether applicable Company Layer constraints are installed before assuming company-specific standards, platform modules, or terminology. Do not invent company-specific requirements for a Generic installation.
  - Check whether a relevant platform capability is available in the concrete project; do not assume a module is installed.
  - For data integrations, identify and confirm the system of record, data classification, and integration owner.
  - Treat compliance and security as delivery constraints, but request confirmation for obligations not documented in an authoritative project or platform source.

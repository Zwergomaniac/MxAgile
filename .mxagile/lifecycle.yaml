schema_version: 1

# Canonical machine-readable lifecycle definition for MxAgile.
# Narrative expansion: .mxagile/orchestrator.md
# State tracking: .concord/scratch/process-state.yaml (per-wave, gitignored)

unit_of_progression: wave

lifecycle:
  initial_phase: discovery

  pre_phase:
    intake:
      optional: true
      external: true
      purpose: >
        External intake bot assists stakeholders in producing mockups and requirements.
        Runs outside developer context with no mxcli, no model access, no git.
        Produces input-resources/ artifacts consumed by Discovery.
      exit_condition: "Completeness-Check: COMPLETE"
      skip_condition: "Developer provides input-resources/ directly"

  phases:

    discovery:
      purpose: >
        Systematically analyse all available sources before any refinement or
        implementation begins. Produces story specifications, UI inventory, and
        an explicit list of open decisions. All findings are classified by evidence
        level (static/model/runtime/browser). When ui_driven=true, Full Discovery
        requires browser-level evidence for runtime-testable scope; without it the
        gate result must reflect partial/model-only discovery. Gate-to-refinement
        must pass before moving forward.
      entry_conditions:
        - "Input resources available (mockup and/or requirements), OR developer explicit approval to start without them"
        - "Intake COMPLETE if intake phase was used"
      exit_gate: gate-to-refinement
      agents: [discovery-agent, ui-agent]
      outputs:
        - "planning/stories/{STORYPREFIX}-*.md"
        - "planning/ui-inventory/*.yaml (evidence: static — mockup-derived)"
        - ".concord/screenshots/mockup/ (evidence: static)"
        - ".concord/screenshots/app/ (evidence: browser — only when runtime available)"
        - "Evidence level classification per finding"
      gate_variants:
        - FULL_UI_DISCOVERY_PASS: "All evidence levels satisfied including browser"
        - PARTIAL_DISCOVERY: "Static/model complete; browser evidence pending"
        - MODEL_ONLY_DISCOVERY: "Only static/model evidence; runtime not started"
        - RUNTIME_BLOCKED: "Runtime failed after correct credential discovery"
      next: [refinement]
      returns_to: []
      invalidation_conditions:
        - "Input resource (mockup or requirements document) changed"
        - "New requirement added that affects discovered scope"
        - "Runtime evidence contradicts a previous static/model finding"

    refinement:
      purpose: >
        Resolve all DECISION REQUIRED items, contradictions between sources, and
        missing business rules before implementation. Every blocker must be answered
        or deliberately assumed. Gate-to-ready produces the implementation checklist.
        Refinement produces Test Contracts (skills/test-contract.md) — the WHAT.
        Verification Plans (skills/verification-plan.md) are produced at Verifying entry
        after implementation, when infrastructure availability and model state are known.
      entry_conditions:
        - "gate-to-refinement: passed"
      exit_gate: gate-to-ready
      agents: [refinement-agent]
      outputs:
        - "sprints/decisions.md entries"
        - "Updated story specifications with acceptance criteria"
        - "planning/test-contracts/TC-NNN.yaml (one per requirement or cohesive group — WHAT)"
        - "Preliminary verification hints in checklist items (optional — not authoritative VPL)"
      next: [ready]
      returns_to: [discovery]
      invalidation_conditions:
        - "Changed input resource requires re-discovery of affected stories"
        - "New DECISION REQUIRED items surfaced during implementing or verifying"

    ready:
      purpose: >
        Gate state: all refinement preconditions met, testability gate passed.
        Implementation checklist generated by gate-to-ready. No dedicated agent.
        Exits on developer explicit approval to begin implementing.
      entry_conditions:
        - "gate-to-ready: passed (includes testability_gate)"
        - "planning/checklists/W*-implementation-checklist.yaml generated"
        - "planning/test-contracts/TC-NNN.yaml present for all in-scope requirements (or testability deferred)"
        - "Note: Verification Plans (VPL) are NOT required at Ready — they are produced at Verifying entry"
      exit_gate: "Developer explicit approval"
      agents: []
      outputs:
        - "planning/checklists/W*-implementation-checklist.yaml"
        - "planning/execution-waves.md updated"
      next: [implementing]
      returns_to: [refinement]

    implementing:
      purpose: >
        Execute the implementation checklist item by item using mxcli MDL scripts.
        Each change is validated before execution and described to the developer.
        Security is handled at defined timing points (D48). For runtime-relevant
        items (pages, navigation, microflows, validations), a warm local development
        runtime (mxcli run --local --watch) provides iterative feedback without
        full restart cycles. Runtime inspection during Implementing is development
        feedback, not formal verification.
      entry_conditions:
        - "Developer explicit approval granted"
      exit_gate: "All checklist items in terminal state: done | blocked | deferred"
      agents: [implementation-agent]
      outputs:
        - "Executed Mendix model changes"
        - "Updated planning/checklists/W*-implementation-checklist.yaml"
      next: [verifying]
      returns_to: [refinement, discovery]

    verifying:
      purpose: >
        Validate implementation against requirements across four dimensions:
        technical quality (quality-gate), UI fidelity (ui-agent), functional
        acceptance (acceptance-agent via Test Contracts), and acceptance gate.
        A wave is complete only when all four pass. The local runtime is started
        in autonomous mode (mxcli run --local, without --watch) — verification
        does not modify the model. APPLICATION_REACHABLE must be confirmed before
        any Playwright interaction. Runtime startup failure is classified as
        TEST_INFRASTRUCTURE_GAP, not APPLICATION_DEFECT.
        Acceptance Agent runs structured campaigns (REQUIREMENT, ROLE, RISK_CHANGE_IMPACT)
        derived from Test Contracts and Verification Plans. Evidence is classified by layer
        (MODEL/BUILD/RUNTIME/FRONTEND) and security dimension
        (VISIBILITY/ACCESSIBILITY/AUTHORIZATION/DATA_SCOPE).
      entry_conditions:
        - "Implementation complete (all checklist items in terminal state)"
        - "Test Contracts present for all in-scope requirements (or testability explicitly deferred)"
        - "Note: Verification Plans are created at Verifying entry (first sub-step), not before"
      exit_gate: "quality-gate AND ui-verification AND acceptance-gate all passed"
      agents: [ui-agent, acceptance-agent]
      sub_steps:
        - step: verification_plan_creation
          skill: skills/verification-plan.md
          description: "Create or refresh VPL for each TC in scope (WHICH layers, post-implementation infrastructure)"
        - step: test_generation
          skill: skills/test-generate.md
          description: "Generate concrete execution steps from Verification Plans (HOW)"
        - step: requirement_campaigns
          description: "Run REQUIREMENT campaigns — one per in-scope requirement"
        - step: role_campaigns
          description: "Run ROLE campaigns — validate full role capability contract including negative proofs"
        - step: regression_campaigns
          description: "Run RISK_CHANGE_IMPACT campaigns for regression scope (when applicable)"
        - step: acceptance_gate
          description: "All campaigns passed, no open DECISION_REQUIRED, all defects classified"
      outputs:
        - "planning/wave-reports/ wave report"
        - "planning/ui-inventory/*_comparison.yaml"
        - "planning/acceptance-campaigns/<wave>/*-campaign-result.yaml"
        - "planning/evidence/manifests/<wave>-evidence-manifest.yaml"
        - ".concord/screenshots/app/"
      next: [done]
      returns_to: [implementing, refinement, discovery]

  terminal_states: [done]

  return_routing:
    principle: >
      Re-enter at the EARLIEST necessary phase for affected scope only.
      Do not restart the entire wave unless fundamental discovery is missing.
      Unaffected stories remain CURRENT.
    rules:
      - when: "Implementation defect found in Verifying"
        return_to: implementing
        scope: "Failed checklist items only (status: failed)"
      - when: "Specification or refinement defect found in Verifying or Implementing"
        return_to: refinement
        scope: "Affected story specifications and decision records"
      - when: "Fundamental missing context, or changed input artifact"
        return_to: discovery
        scope: "Affected stories; unaffected stories remain CURRENT"

  change_propagation:
    status_vocabulary:
      CURRENT: "Artifact is consistent with its upstream sources"
      CHANGED: "Artifact has been directly modified"
      IMPACT_REVIEW_REQUIRED: "An upstream source changed; downstream impact not yet assessed"
      STALE: "Assessed as outdated following upstream change"
      REOPENED: "Explicitly marked for rework"
      VERIFIED: "Passed acceptance verification in the Verifying phase"
    principle: >
      A changed upstream artifact invalidates only affected downstream work.
      Scope boundaries follow wave and story granularity.
      Do not mark unrelated stories as stale.
    examples:
      mockup_changed:
        upstream: "input-resources/ui-ux/"
        may_affect: [story_specifications, ui_inventory, implementation, verification_evidence]
        earliest_return: discovery
        note: "Assess which stories reference the changed mockup. Unaffected stories remain CURRENT."
      spec_changed_after_implementation:
        upstream: "planning/stories/{STORYPREFIX}-*.md"
        may_affect: [implementation_checklist, implementation, verification_evidence]
        earliest_return: refinement
        note: "If the change is unambiguous and agreed, may proceed directly to Implementing."
      implementation_defect:
        upstream: "implementation-checklist.yaml status:failed items"
        may_affect: [verification_evidence]
        earliest_return: implementing
        note: "Checklist-based scoped return. Only status:failed items are reworked."
      design_contract_changed:
        upstream: "input-resources/ui-ux/*.html (mockup.revision bumped)"
        may_affect: [test_contracts, verification_plans, story_specifications, evidence_manifests]
        earliest_return: discovery
        note: "Run design-contract-intake again. Test contracts referencing the old revision become IMPACTED."
      test_contract_stale:
        upstream: "requirements/REQ-NNN.yml acceptance_criteria changed"
        may_affect: [test_contracts, verification_plans, campaign_results]
        earliest_return: refinement
        note: "Re-run skills/test-contract.md for affected requirements. Mark old contract stale, do not delete."
      acceptance_defect_application:
        upstream: "Acceptance campaign: APPLICATION_DEFECT classification"
        may_affect: [implementation, verification_evidence]
        earliest_return: implementing
        note: "Defect classified as APPLICATION_DEFECT routes to Implementing. Scoped to failed proof points only."

  state_tracking:
    file: ".concord/scratch/process-state.yaml"
    schema: ".mxagile/schemas/process-state.schema.json"
    gitignored: true
    scope: per_wave
    required_gate_keys:
      - "waves.<wave>.gates.gate_to_refinement: not_recorded | passed | failed"
      - "waves.<wave>.gates.gate_to_ready: not_recorded | passed | failed"
      - "waves.<wave>.gates.testability_gate: not_recorded | passed | failed"
      - "waves.<wave>.gates.acceptance_gate: not_recorded | passed | failed | pending"
    canonical_update_rule: >
      Always write the COMPLETE wave block when updating process-state.yaml.
      Never append individual keys into an existing block.
      Appending creates duplicate YAML keys (e.g. two phase: lines).
      See .mxagile/policies/lifecycle-resync.md for the full update procedure.
    resync_policy: ".mxagile/policies/lifecycle-resync.md"
    note: >
      Gates write results in the same work step they run.
      not_recorded is only valid before a gate has been executed for a wave.
      Drift between file and reality must be actively reported by the agent.

platform-modules-information:
  introduction:
    title: Platform & Reuse First
    text: |
      Mercedes-Benz Plattformmodule gelten als vorhandene Plattformfähigkeiten und sollen standardmäßig genutzt werden.
      Eigene Entwicklung nur bei fachlich begründeter Abweichung.
    pre_development_check:
      - Mercedes-Benz Plattformmodule
      - Mendix Marketplace (FOSS/Open Source)
      - Erst danach Eigenentwicklung
  change_rule:
    title: Änderungsregel
    text: |
      Mercedes-Benz Plattformmodule dürfen nicht modifiziert werden.
      Sie werden zentral gepflegt und erhalten Updates.
    extension_methods:
      - Konfiguration
      - Rollenmapping
      - Extension Points
      - Projektspezifische Module
    note: Nicht über Änderungen am Modul selbst.
  modules:
    - name: MB_SSO
      description: Authentifizierung und Mitarbeiterinformationen via Claims.
    - name: MB OIDC
      description: Federation, OIDC, Rollen- und Claim-Mapping.
    - name: MB No Access
      description: Standardverhalten für Nutzer ohne fachliche Rolle.
    - name: MB UI
      description: Designsystem, CSS, Layouts und Standardkomponenten.
    - name: MB Databricks
      description: Zugriff auf Datenprodukte. SQL-Know-how erforderlich.
    - name: MB SimplifAI
      description: AI- und LLM-Funktionen.
    - name: MB Governance Client
      description: Pflichtmodul für Lizenzierung.
    - name: MB Feedback
      description: Standard für Nutzerfeedback.
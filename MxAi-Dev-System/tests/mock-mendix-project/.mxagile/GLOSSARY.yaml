metadata:
  title: Mercedes-Benz Mendix AI Glossary
  purpose: Internal terminology and reusable delivery guidance for AI assistants.
  scope: This file is copied with the Mendix project template.
  precedence:
    - Project-specific facts and decisions in projekt.md take precedence for the project.
    - Platform module detail references in .MxAgile/modules/ take precedence for technical module behavior.
    - This glossary provides terminology and default routing, not an implementation specification.

reading_order:
  - Read this glossary for internal terms and initial routing.
  - Read .MxAgile/modules/platform-modules.md before proposing custom Mendix functionality.
  - Read the relevant module detail before work involving authentication, roles, UI, feedback, or governance.
  - Record unresolved facts as ASSUMPTION or DECISION REQUIRED.

terms:
  framework:
    MxAgile:
      category: Delivery process
      description: Project-local process for AI-assisted Mendix delivery from intake through verification.
      agent_hint: Follow .MxAgile/orchestrator.md and the relevant phase gate.
    MxMocketeer:
      category: Shared Copilot prompt
      description: Discovery and interactive HTML mockup prompt for clarifying requirements and UI flows.
      agent_hint: Produces input for planning; it does not create a final Mendix model.
    MxScrumMaster:
      category: Shared Copilot prompt
      description: Product, backlog, and delivery-planning prompt for Mendix work.
      agent_hint: When configured, the Mendix Epics Board remains the operational backlog source of truth.
    Mendix_Epics_Board:
      category: Backlog
      description: Operational source of truth for epics, stories, acceptance criteria, status, and sprint assignment.
      agent_hint: Do not update Board status, tasks, or sprints in local files or automatically.
    Derived_work_artifact:
      category: Planning
      description: Local specification, test, traceability, or dependency artifact derived from a Board story.
      agent_hint: Reference the Board ID and source fingerprint; never treat it as a second backlog.
    Implementation_Wave:
      category: Planning
      description: Technical implementation sequence within or across Board sprints.
      agent_hint: It is not a local sprint.
    ASSUMPTION:
      category: Decision status
      description: A statement not confirmed by a source or stakeholder.
      agent_hint: Mark it visibly and request confirmation when it affects delivery.
    DECISION_REQUIRED:
      category: Decision status
      description: A decision that an agent must not make silently.
      agent_hint: Block only the affected work when the decision materially changes implementation.

  platforms:
    Alice:
      category: IAM
      description: Mercedes-Benz Identity and Access Management platform.
      keywords: [roles, entitlements, access_request, approvals, reviewer, project_admin]
      agent_hint: Consider Alice for user, role, entitlement, and access-request requirements. Do not propose separate local user administration without a confirmed exception.
    Smaragd:
      category: PDM
      description: Central Product Data Management system for vehicle development.
      keywords: [vehicle_data, engineering, structure, BOM, product_development]
      agent_hint: Verify whether Smaragd is the system of record for vehicle or engineering data.
    LeanIX:
      category: Enterprise architecture
      description: Application landscape and enterprise-architecture management platform.
      keywords: [application_inventory, APP_ID, architecture]
      agent_hint: Confirm applicable APP-ID and architecture registration requirements for productive applications.
    MASSP:
      category: Governance
      description: Mercedes App Self Service Platform.
      keywords: [application_governance, approvals, AI]
      agent_hint: Check applicable governance processes for productive apps and AI functionality.
    MB_SSO:
      category: Mendix platform module
      description: Preferred authentication and employee-information module based on claims.
      agent_hint: Use MB_SSO.MBUser for employee data, not System.User. Read .MxAgile/modules/MB_SSO.md before implementing authentication or project roles.
    CONST_UserroleAppname:
      category: MB_SSO configuration
      description: Constant that defines the prefix for project roles.
      agent_hint: Set and validate it before creating business roles. Project roles follow {APP}_<RoleName>; NewSSOUser is the onboarding and no-access exception.
    MB_NoAccess:
      category: Mendix platform module
      description: Standard landing page for successfully authenticated users without a business project role.
      agent_hint: Use MB_NoAccess.Home_Web and the configured default role. Do not create a parallel no-access page or manually assign the default module role.
    MB_UI:
      category: Mendix platform module
      description: Mercedes-Benz design system for Mendix layouts, navigation, components, and theme tokens.
      agent_hint: Use MB_UI.MB_Main_Layout for pages and MB_UI.MB_Popup for dialogs. Extend rather than replace MB_UI; read .MxAgile/modules/MB_UI.md for details.
    MB_Feedback:
      category: Mendix platform module
      description: Standard feedback capability with rating persistence, dialog, snippet, and role model.
      agent_hint: Check MB_Feedback before building custom feedback pages or rating entities. Read .MxAgile/modules/MB_Feedback.md for integration and role mapping.
    MB_Governance:
      category: Mendix platform module
      description: Platform module for governance and compliance requirements.
      agent_hint: Confirm project-specific obligations before implementation. Unverified obligations remain DECISION REQUIRED.
    MB_OIDC:
      category: Platform capability
      description: Federation plus OIDC, role, and claim mapping capability.
      agent_hint: Clarify with platform and security owners before choosing a non-standard authentication or federation design.
    MB_Databricks:
      category: Platform capability
      description: Access to data products.
      agent_hint: Verify data classification, ownership, integration responsibility, and required SQL knowledge.
    MB_SimplifAI:
      category: Platform capability
      description: AI and LLM capability for Mendix projects.
      agent_hint: Clarify data access, responsible AI, governance, and operating responsibilities before designing custom AI integrations.
    Hierarchy_Tree:
      category: Platform capability
      description: Employee and organizational-hierarchy resolution capability.
      agent_hint: Check it before implementing custom organization or supervisor hierarchy logic.

  security:
    SSO:
      description: Single Sign-On.
    OIDC:
      description: OpenID Connect.
    SAML:
      description: Security Assertion Markup Language.
    Entitlement:
      description: A package of access permissions.
    PID_User:
      description: Technical user for APIs and system integration.
      agent_hint: Do not use a personal account for system-to-system access.
    RISE:
      description: Mercedes-Benz security and compliance context.
      agent_hint: Confirm the applicable assessment and release requirements with the responsible security or compliance owner before productive release.

  governance:
    APP_ID:
      description: Unique application identifier.
    ASI:
      description: App Standard Insights.
      agent_hint: Use when applicable to obtain compliance and quality indicators.
    FOSS:
      description: Free and Open Source Software.
      agent_hint: Check and document usage according to applicable governance rules.
    Compliance:
      description: Conformance with company and legal requirements.

  agile:
    PO:
      description: Product Owner.
    SM:
      description: Scrum Master.
    AO:
      description: Application Owner.
    ProjectAdmin:
      description: Person responsible for an application.
    GRA:
      description: Global Role Assigner.

  vehicle_development:
    BR:
      description: Baureihe.
    BM:
      description: Baumuster.
    BEV:
      description: Battery Electric Vehicle.
    BN:
      description: Bordnetz.
    BFF:
      description: Basisfahrfunktion.
    ATG:
      description: Aggregatetraeger Gesamtfahrzeug.
    MDS:
      description: Mercedes-Benz Development System.

  organization:
    RD:
      description: Research and Development.
    IT:
      description: Information Technology.
    MO:
      description: Manufacturing Operations.
    PP:
      description: Produktionsplanung.
    MBAG:
      description: Mercedes-Benz Group AG.

  ai:
    Agent:
      description: AI system with tool usage and decision logic.
    MCP:
      description: Model Context Protocol.
    GenAICommons:
      description: Mendix GenAI Framework.
    AgentCommons:
      description: Mendix Agent Framework.
    Copilot:
      description: Microsoft AI Assistant.
    Claude:
      description: Anthropic AI Assistant.
    mxcli:
      description: Tool for Mendix MDL, validation, and checks.
      agent_hint: Follow project-local write and model-safety rules before executing model operations.
    Concord_MCP:
      description: Bridge between AI agents, Mendix Studio Pro, and project knowledge.
      agent_hint: It does not override project safety or model-protection rules.
    MPR_v2:
      description: Structured Mendix project representation with .mpr and mprcontents.
      agent_hint: Apply the project's materialization checks before and after model write operations.

principles:
  architecture:
    - Reuse documented Mercedes-Benz platform modules first.
    - Check Mendix Marketplace or FOSS before proposing custom implementation.
    - Prefer configuration and extension points over customization of platform modules.
    - Define and respect the system of record for every integration.
  security:
    - Apply security by design and least privilege.
    - Prefer corporate IAM and confirmed role concepts over local user management.
    - Never store credentials in source code or versioned template artifacts.
  development:
    - Use Mendix standard modules and documented platform modules before custom code.
    - Keep microflows simple and prefer maintainability over accidental complexity.
  ai_projects:
    - Confirm responsible AI assessment, human accountability, model usage, and compliance requirements before productive AI functionality.

agent_rules:
  - Never invent Mercedes-Benz-specific terminology or expand an ambiguous abbreviation without confirmation.
  - Check whether a relevant platform capability is available in the concrete project; do not assume a module is installed.
  - For vehicle or engineering-data integrations, identify and confirm the system of record, data classification, and integration owner.
  - Treat compliance and security as delivery constraints, but request confirmation for obligations not documented in an authoritative project or platform source.

<!DOCTYPE html>
<!--
  TC-01 fixture: Browser document itself is scrollable.
  No Mendix layout containers. document.documentElement is the scroll container.
  scrollHeight ~= 3600px, viewport set by test to 720px.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>mx-scroll fixture: simple document scroll</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #f5f5f5; font-family: sans-serif; }
    .section {
      height: 600px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      border-bottom: 2px solid #ccc;
    }
    .section:nth-child(odd)  { background: #e0e0ff; }
    .section:nth-child(even) { background: #ffe0e0; }
  </style>
</head>
<body>
  <div class="section" data-section="1">Section 1 — top</div>
  <div class="section" data-section="2">Section 2</div>
  <div class="section" data-section="3">Section 3</div>
  <div class="section" data-section="4">Section 4</div>
  <div class="section" data-section="5">Section 5</div>
  <div class="section" data-section="6">Section 6 — bottom</div>
</body>
</html>

# Fixture: NO_TC_YET — new requirement, no TC in this domain
# Verifies: NO_TC_YET does NOT trigger automatic TC/PP/VPL/test/evidence creation
#
# Synthetic fixture — no real project data.

scenario: no_tc_yet_no_cascade
description: >
  A new Requirement REQ-NEW-001 is created for a domain (reporting module) where no
  Test Contract currently exists. The Requirement is in DRAFT status with accepted ACs.
  Classification: NO_TC_YET.

requirement:
  id: REQ-NEW-001
  title: Generate monthly summary report
  status: draft
  domain: reporting_module
  acceptance_criteria:
    - id: AC-001
      given: A user with REPORT_VIEWER role is authenticated
      when: they navigate to the Reports section
      then: they see the Generate Monthly Summary button

verification_gap:

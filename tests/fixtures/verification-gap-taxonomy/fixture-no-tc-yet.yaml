expected_NO_automatic_creation:
  tc_created: false          # NO_TC_YET does NOT create a TC
  pp_created: false          # NO_TC_YET does NOT create proof points
  vpl_created: false         # NO_TC_YET does NOT create a VPL
  executable_test_created: false   # NO_TC_YET does NOT generate Playwright steps
  evidence_collected: false  # NO_TC_YET does NOT collect evidence

deferred_until:
  - requirement status transitions to accepted
  - testability gate passes
  - implementation is sufficiently stable

note: >
  NO_TC_YET is a diagnostic classification, not an execution trigger.
  Recording NO_TC_YET in the story specification is the correct action.
  TC materialization is deferred to post-acceptance/post-gate.

# CapTrack GAP Records Fixture
# Regression fixture for CapTrack project — DO NOT MODIFY APPLICATION LOGIC
# Used by: test-captrack-regression.ps1 as static validation reference
# Purpose: Representative GAP records for CapTrack-specific interaction gaps.
#          Tests that the GAP policy correctly handles expandable_area interactions.
#
# CapTrack Business Rules (verbatim):
#   - Expandable areas (Gesamtübersicht Abteilungsbereiche, Zielmanagement Zielkarten,
#     Basisjahr/Folgejahre, Mitarbeitermatrix) MUST be discovered as expandable_area interactions
#   - Snippet/popup content on existing pages MUST NOT automatically derive new Mendix pages

gaps:
  - gap_id: GAP-CAPTRACK-ABTEILUNG-EXPAND
    gap_type: INTERACTION_GAP
    severity: MATERIAL
    page_id: PAGE-GESAMTUEBERSICHT
    description: >-
      Ausklappbare Abteilungsbereiche reagieren nicht auf Klick.
      Expand-Effekt (EFF-ABTEILUNG-EXPAND) fehlt in der Implementierung.
      Laut Design Contract ist STATE-ABTEILUNG-EXPANDED ein CONFIRMED interaction_state.
    target_state_ref: STATE-ABTEILUNG-EXPANDED
    target_effect_ref: EFF-ABTEILUNG-EXPAND
    implementation_actual: >-
      Abteilungsbereiche are rendered as static sections without an expand control.
      No expand/collapse toggle present.
    lifecycle_status: REPAIR_PROPOSED
    repair_description: >-
      Add expand/collapse toggle to Abteilung section header.
      Implement both EFF-ABTEILUNG-EXPAND and EFF-ABTEILUNG-COLLAPSE effects.
    decision_required: false
    decision_ref: null
    classification_rule: >-
      This is INTERACTION_GAP, not a new requirement.
      The target behavior is CONFIRMED in the Design Contract.
      A GAP does NOT create a new REQ-NNN. No change to fachliches Soll needed.

  - gap_id: GAP-CAPTRACK-ZIELKARTEN-EXPAND
    gap_type: INTERACTION_GAP
    severity: MATERIAL
    page_id: PAGE-ZIELMANAGEMENT
    description: >-
      Zielkarten in Zielmanagement sind nicht ausklappbar.
      expandable_area interaction_type fehlt im UI-Inventar und in der Implementierung.
    target_state_ref: STATE-ZIELKARTE-EXPANDED
    target_effect_ref: EFF-ZIELKARTE-EXPAND
    implementation_actual: "Zielkarten rendered as static card components."
    lifecycle_status: DETECTED
    repair_description: "Add expand/collapse to Zielkarte component."
    decision_required: false
    decision_ref: null

  - gap_id: GAP-CAPTRACK-E4-ROLE
    gap_type: ROLE_GAP
    severity: CRITICAL
    page_id: null   # Role gap — not page-specific
    description: >-
      E4 Eintragung and E4 Überprüfung have no demo identity with Team scope.
      Role campaign acceptance gate cannot pass.
    target_state_ref: null
    target_effect_ref: null
    implementation_actual: >-
      Demo Role Switcher does not include E4 roles with representative Team scope context.
    lifecycle_status: DETECTED
    repair_description: >-
      Add E4 Eintragung and E4 Überprüfung demo users with Team-scoped test data.
      This is a test infrastructure task, not a fachliche requirement change.
    decision_required: false
    decision_ref: null
    classification_rule: >-
      ROLE_GAP — missing E4 test identity.
      NOT an infrastructure gap. NOT a platform_boundary issue.
      Fix: provide representative Team scope in demo/test setup.

  - gap_id: GAP-CAPTRACK-PLATFORM-LOGIN
    gap_type: PLATFORM_BOUNDARY_GAP
    severity: CRITICAL
    page_id: SCREEN-LOGIN
    description: >-
      Login-Seite als App-Seite implementiert anstatt MB_SSO zu delegieren.
    target_state_ref: null
    target_effect_ref: null
    implementation_actual: >-
      App-level Mendix login page exists. Should be MB_SSO boundary.
    lifecycle_status: DETECTED
    repair_description: >-
      DO NOT implement login as CapTrack app page.
      Remove app-level login page and configure MB_SSO as authentication provider.
      Create DEC-NNN with decision_type: platform_boundary.
    decision_required: true
    decision_ref: DEC-PLATFORM-001
    classification_rule: >-
      PLATFORM_BOUNDARY_GAP — not IMPLEMENTATION_GAP.
      The repair is to REMOVE the app-level login, not to align it with a mockup.
      This does NOT generate a new REQ-NNN for login functionality.

# Classification rules (fixture-level assertions)
fixture_assertions:
  - "INTERACTION_GAP for missing expandable_area does NOT create new REQ-NNN"
  - "ROLE_GAP for missing E4 identity does NOT route to Mockup Refinement"
  - "PLATFORM_BOUNDARY_GAP repair is REMOVE not ALIGN"
  - "GAP for CONFIRMED interaction = REPAIR, not REFINEMENT"
  - "A purely technical repair does NOT require a new fachliche Decision"
  - "No production data, no real auth data in any fixture"

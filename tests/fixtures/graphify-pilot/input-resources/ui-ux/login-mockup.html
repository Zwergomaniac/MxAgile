    <h1>Sign In</h1>
    <form id="login-form" novalidate>
      <div class="field">
        <label for="username">Username</label>
        <input id="username" type="text" autocomplete="username" aria-required="true"
               placeholder="Enter username" data-mx-req="REQ-001">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" aria-required="true"
               placeholder="Enter password" data-mx-req="REQ-001 REQ-002">
        <div id="password-error" class="error-msg" aria-live="polite" role="alert"></div>
      </div>
      <div id="form-error" class="error-msg" aria-live="polite" role="alert"></div>
      <button id="login-button" type="submit" class="btn-primary"
              data-mx-req="REQ-001" data-mx-flow="FLOW-001" data-mx-flowstep="FLOWSTEP-002">
        Login
      </button>
    </form>
    <p class="spec-footer">
      Fixture: MOCKUP-LOGIN-PILOT &mdash; All data fictional &mdash; REQ-001, REQ-002
    </p>

  <script>
    // Mock login — MOCKUP-LOGIN-PILOT, revision 1
    // FLOW-001: FLOWSTEP-001 (Enter Credentials) → FLOWSTEP-002 (Submit Login)
    const form     = document.getElementById('login-form');
    const formErr  = document.getElementById('form-error');
    const passErr  = document.getElementById('password-error');

    let failedAttempts = 0;
    const MAX_ATTEMPTS = 5; // REQ-001: lock after 5 failed attempts

    // REQ-002: password complexity (simplified front-end check for mockup)
    function meetsComplexity(pw) {
      return pw.length >= 8 && /[A-Z]/.test(pw) && /\d/.test(pw) && /[!@#$%^&*]/.test(pw);
    }

    form.addEventListener('submit', function(e) {
      e.preventDefault();
      formErr.textContent = '';
      passErr.textContent = '';

      if (failedAttempts >= MAX_ATTEMPTS) {
        formErr.textContent = 'Account locked after 5 failed attempts. (REQ-001 / BR-001)';
        return;
      }

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      if (!username || !password) {
        formErr.textContent = 'Username and password are required.';
        return;
      }

      if (!meetsComplexity(password)) {
        // REQ-002: complexity validation feedback
        passErr.textContent = 'Password must be 8+ chars with uppercase, digit, and special character. (REQ-002)';
        return;
      }

      // Simplified: mock successful login for testuser/TestPass1!
      if (username === 'testuser' && password === 'TestPass1!') {
        formErr.textContent = '';
        formErr.style.color = '#1a6632';
        formErr.textContent = 'Login successful — redirecting to dashboard... (FLOWSTEP-003 → FLOWSTEP-004)';
        failedAttempts = 0;
      } else {
        failedAttempts++;
        const remaining = MAX_ATTEMPTS - failedAttempts;
        if (remaining > 0) {
          formErr.style.color = '#b00020';
          formErr.textContent = `Invalid credentials. ${remaining} attempt(s) remaining before lockout. (REQ-001)`;
        } else {
          formErr.style.color = '#b00020';
          formErr.textContent = 'Account locked after 5 failed attempts. (REQ-001 / BR-001)';
        }
      }
    });
  </script>

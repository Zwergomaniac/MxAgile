# Synthetic Core Regression Fixture: Platform Boundaries
# Tests that SSO/authentication screens are classified as platform_boundary: true,
# not as fachliche requirements.
# All domain content is synthetic (DemoApp is not a real project).
# Framework behavior under test:
#   - Auth/session screens excluded from UI parity and REQ-NNN generation
#   - Demo role switcher classified as test-only, not productive login
#   - EXCLUDE_FROM_UI_PARITY and DO_NOT_MODIFY rules enforced

platform_boundaries:
  - id: PLATFORM-SSO-PROVIDER
    provider: SSO_PROVIDER
    responsibilities:
      - authentication
      - sign-in
      - password-management
      - initial-password-setup
      - session-management
    mockup_behavior:
      - "No productive login screen in DemoApp UI"
      - "Demo Role Switcher is test-only mechanism — not productive login"
      - "Password reset and user management not app-level concern"
    parity_rule: EXCLUDE_FROM_UI_PARITY
    implementation_rule: REUSE_PLATFORM_MODULE
    role_source_rule: >-
      Business roles (Admin, OrgLead, OrgDelegate, DeptManager, DeptReviewer,
      TeamEntry, TeamReviewer) remain independently valid regardless of SSO_PROVIDER
      authentication mechanism.
    modification_rule: DO_NOT_MODIFY
    excluded_screens:
      - SCREEN-LOGIN
      - SCREEN-PASSWORD-RESET
      - SCREEN-DEMO-ROLE-SWITCHER
    decision_ref: DEC-001
    status: CONFIRMED
    notes: >-
      Demo Role Switcher (SCREEN-DEMO-ROLE-SWITCHER) is a test mechanism.
      It is platform_boundary: true and excluded from UI parity.
      It is NOT productive user management. It is NOT a login screen.

excluded_screen_rule:
  summary: "REQ-NNN MUST NOT be generated from any screen with platform_boundary: true."
  details:
    - "REQ-NNN requirements — must not originate from platform boundary screens"
    - "SPEC-NNN specifications — must not originate from platform boundary screens"
    - "TASK-NNN implementation tasks — only REMOVE/CONFIGURE platform module allowed"
    - "UI-Parity test cases — excluded from parity scope"
  required: "DEC-NNN with decision_type: platform_boundary when deviation detected"

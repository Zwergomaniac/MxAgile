# Synthetic Core Regression Fixture: Revision Lifecycle
# Tests revision lifecycle invariants: active_target invariant, role preservation,
# platform boundary effect classification.
# All domain content is synthetic (DemoApp is not a real project).
# Framework behavior under test:
#   - Exactly ONE revision per mockup bundle carries the active-target flag
#   - Roles preserved across revisions independent of platform boundary changes
#   - PLATFORM_BOUNDARY effects do NOT create fachliche REQ-NNN
#   - SCREEN-LOGIN in expected_superseded_ids (not unexpected_missing_ids)


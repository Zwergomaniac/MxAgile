    change_scope: >-
      Removed login screen (SCREEN-LOGIN) — SSO_PROVIDER handles authentication.
      Role model preserved. TeamEntry/TeamReviewer COVERAGE_GAP documented.
    artifact_hash: null

active_target_invariant:
  mockup_id: MOCKUP-DEMO-APP
  active_revision: REV-002
  assertion: >-
    At any point in time, exactly one revision per mockup bundle is marked as the active target.
    REV-001 (SOURCE) is not the active target because it was superseded by REV-002.
    Implementation-Agent MUST use REV-002, never REV-001.

